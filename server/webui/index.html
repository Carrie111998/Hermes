<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rota</title>
<!--
  interfaze-agent — B2B sales-agent web app, served by the interfaze-api
  FastAPI process (server/app.py) alongside the real /api/v1 backend.
  All data flows through js/api.js to the real /api/v1 backend.
  See server/WEBUI_CONNECTION_PRD.md for the connection contract.
-->
<script>
  // Pre-paint theme: avoid a light flash in dark mode.
  (function () {
    try {
      var t = localStorage.getItem('ifz-theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) { /* storage unavailable — default light */ }
  })();
</script>
<!-- Mono is the primary face — nav, tables, labels and every number — so it
     is the one that must not arrive late. Satoshi and Inter cover headlines
     and prose respectively and can swap in a beat later. -->
<link rel="preload" href="./fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/caret.css">
<!-- Square mark: `r_` — the letter is Rota, the caret is Interfaze. Drawn as
     paths because a favicon renders outside the page and cannot use Satoshi.
     Kept in sync with squareMark() in js/shell.js. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232563FF'/%3E%3Cpath d='M12 25V13.5a6.5 6.5 0 0 1 6.5-6.5' fill='none' stroke='%23FFFFFF' stroke-width='6'/%3E%3C/svg%3E">
<meta name="theme-color" content="#2563FF">
<script>window.__HERMES_CONFIG__={maxUploadBytes:__MAX_UPLOAD_BYTES__,csrfToken:__CSRF_TOKEN_JSON__,chatEnabled:__CHAT_ENABLED__};</script>
<script>(function(){
  var cfg=window.__HERMES_CONFIG__||{},token=cfg.csrfToken||'';
  if(!token||!window.fetch)return;
  var originalFetch=window.fetch.bind(window);
  function sameOriginUnsafe(input,init){
    var method=((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
    if(!/^(POST|PUT|PATCH|DELETE)$/.test(method))return false;
    try{
      var raw=(typeof input==='string'||input instanceof URL)?input:(input&&input.url)||'';
      var url=new URL(raw,document.baseURI||location.href);
      if(url.origin!==location.origin)return false;
      return !/\/api\/(auth\/login|csp-report)$/.test(url.pathname);
    }catch(_){return false;}
  }
  window.fetch=function(input,init){
    if(sameOriginUnsafe(input,init)){
      var opts=init?Object.assign({},init):{};
      var headers=new Headers(opts.headers!==undefined?opts.headers:((input&&input.headers)||{}));
      if(!headers.has('X-Hermes-CSRF-Token'))headers.set('X-Hermes-CSRF-Token',token);
      opts.headers=headers;
      return originalFetch(input,opts);
    }
    return originalFetch(input,init);
  };
})();</script>
</head>
<body>
<a class="ifz-skip" href="#ifz-main">Skip to main content</a>
<div id="app" class="ifz-app"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
