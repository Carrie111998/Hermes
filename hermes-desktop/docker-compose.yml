services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-desktop
    restart: unless-stopped
    ports:
      - "127.0.0.1:5901:5901"
      - "127.0.0.1:6080:6080"
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?Run ./setup.sh to generate hermes-desktop/.env}
      VNC_RESOLUTION: 1920x1080
    healthcheck:
      test: ["CMD-SHELL", "su - hermes -c 'env HOME=/home/hermes DISPLAY=:1 XAUTHORITY=/home/hermes/.Xauthority /usr/bin/xdotool getdisplaygeometry >/dev/null 2>&1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - desktop_home:/home/hermes

volumes:
  desktop_home:
