services:
  - type: web
    name: hermes-agent
    rootDir: .
    runtime: python
    plan: starter
    buildCommand: uv sync --frozen --extra web
    startCommand: uv run hermes gateway run --no-supervise
    healthCheckPath: /v1/models
    envVars:
      - key: API_SERVER_ENABLED
        value: "true"
      - key: API_SERVER_HOST
        value: 0.0.0.0
      - key: API_SERVER_PORT
        value: "$PORT"
      - key: API_SERVER_KEY
        sync: false
      - key: HERMES_HOME
        value: /var/data/hermes
    disk:
      name: hermes-runtime-data
      mountPath: /var/data
      sizeGB: 10
