services:
  - type: web
    name: hermes-agent
    runtime: python
    plan: starter
    buildCommand: uv sync --frozen --extra web
    startCommand: uv run uvicorn hermes_cli.web_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LIN_HERMES_RUNTIME_TOKEN
        sync: false
      - key: HERMES_HOME
        value: /var/data/hermes
    disk:
      name: hermes-runtime-data
      mountPath: /var/data
      sizeGB: 10
