services:
  - type: web
    name: hermes-agent
    rootDir: .
    runtime: python
    plan: starter
    buildCommand: uv sync --frozen --extra web
    startCommand: uv run hermes dashboard --host 0.0.0.0 --port $PORT --no-open
    healthCheckPath: /api/status
    envVars:
      - key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        sync: false
      - key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        sync: false
      - key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        sync: false
      - key: HERMES_DASHBOARD_PUBLIC_URL
        sync: false
      - key: HERMES_HOME
        value: /var/data/hermes
    disk:
      name: hermes-runtime-data
      mountPath: /var/data
      sizeGB: 10
