[package]
name = "hermes-trace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Low-memory trajectory validation and projection for Hermes Agent"

[lib]
name = "hermes_trace"
path = "src/lib.rs"

[[bin]]
name = "hermes-trace"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
