<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Station</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="sigil">☤</span> Hermes Station <small>amorphous applications</small></div>
  <div class="top-actions">
    <span id="agent-badge" class="badge"><span class="dot"></span><span id="agent-label">agent</span></span>
    <button class="btn ghost" id="btn-evolve" title="Run the evolution curator now">⚗ Evolve</button>
    <button class="btn ghost" id="btn-proposals">▣ Proposals <span id="proposal-count" class="pill zero">0</span></button>
    <button class="btn ghost" id="btn-chat-toggle" title="Toggle chat dock">◎ Chat</button>
  </div>
</header>

<div id="grid-wrap"><div id="grid"></div><div id="hidden-bar" class="hidden-bar"></div></div>

<aside id="proposal-tray">
  <div class="tray-head"><h3>Evolution proposals</h3>
    <button class="icon-btn" id="tray-close">✕</button></div>
  <div id="proposal-list"></div>
</aside>

<div id="ctx-menu"></div>

<div id="comp-chat">
  <div class="head"><span>◎ Ask <span class="scope" id="comp-chat-title"></span></span>
    <button class="icon-btn" id="comp-chat-close">✕</button></div>
  <div class="log" id="comp-chat-log"></div>
  <form id="comp-chat-form"><input id="comp-chat-input" autocomplete="off"
    placeholder="Ask about this component, or tell it to change…"></form>
</div>

<section id="chat-dock" data-position="bottom">
  <div id="chat-head">
    <span class="who">◎ Hermes</span>
    <span class="hint">full agent · changes the dashboard live · /rebuild · /evolve</span>
    <button class="icon-btn" id="chat-dock-move" title="Dock right / bottom">⇄</button>
    <button class="icon-btn" id="chat-dock-hide" title="Collapse">—</button>
  </div>
  <div id="chat-log"></div>
  <form id="chat-form">
    <input id="chat-input" autocomplete="off"
           placeholder="Ask Hermes, or tell it to reshape your dashboard…">
    <button class="btn primary sm" type="submit">Send</button>
  </form>
</section>

<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
