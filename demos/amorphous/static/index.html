<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amorphous Applications — Mission Control</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand">☤ <span>Amorphous</span> Mission Control</div>
  <div class="top-actions">
    <span id="agent-badge" class="badge">agent: …</span>
    <button id="btn-evolve" title="Run the evolution curator now">⚗ Evolve now</button>
    <button id="btn-proposals" title="Pending proposals">▣ Proposals <span id="proposal-count" class="pill">0</span></button>
    <button id="btn-chat-toggle" title="Toggle chat dock">◎ Chat</button>
  </div>
</header>

<main id="grid"></main>

<aside id="proposal-tray" class="hidden">
  <div class="tray-head">
    <h3>Evolution proposals</h3>
    <button class="ghost" id="tray-close">✕</button>
  </div>
  <div id="proposal-list"></div>
</aside>

<section id="chat-dock" data-position="bottom">
  <div id="chat-head">
    <span>◎ Hermes</span>
    <span class="chat-hint">try: /rebuild focus on incidents · /evolve</span>
    <span class="chat-buttons">
      <button class="ghost" id="chat-dock-move" title="Move dock">⇄</button>
      <button class="ghost" id="chat-dock-hide" title="Hide">—</button>
    </span>
  </div>
  <div id="chat-log"></div>
  <form id="chat-form">
    <input id="chat-input" autocomplete="off"
           placeholder="Ask Hermes anything, or /rebuild <describe the dashboard you want>…">
    <button type="submit">Send</button>
  </form>
</section>

<script src="/static/app.js"></script>
</body>
</html>
