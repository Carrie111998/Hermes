# Only sources with a working adapter belong here. An entry with no verifier
# renders on the Data Sources page as permanently unavailable, which reads as a
# broken product rather than as the honest "not integrated yet" it means.
# Removed 2026-08-20: un-comtrade and eurostat-comext (market aggregates only —
# they cannot name a company at any level of adapter effort), auma (lists fairs,
# not exhibitors), companies-house (needs a key and a GB-only adapter nobody has
# written), b2match-export (no customer has supplied an export), jetro-jmesse
# (service discontinued 2026-03-31). Their history is unaffected: evidence,
# organization links and partitions carry source_id as free text with no foreign
# key, so removing a definition never orphans a record.
- source_id: customer-list-corpus
  version: '1'
  display_name: Customer list corpus
  publisher: Customer-supplied company list
  jurisdiction: [global]
  categories: [matchmaking]
  homepage: null
  access_tier: customer_upload
  entity_levels: [named_company]
  capabilities: [organizations, candidate_verification]
  # Only for rows carrying a provenance_url; the rest abstain.
  emits: [company_name, country, domain, buyer_role, product_term]
  countries: []
  sector_ids: []
  freshness_days: 365
  adapter_mode: live
  default_enabled: false
  health: active
  last_verified_at: '2026-08-20'
  license_note: >
    Corpora loaded with `import-candidates`. Rows that carry a provenance_url
    are cited as evidence; rows without one supply a name only and need another
    source to verify them.
- source_id: ted
  version: '1'
  display_name: Tenders Electronic Daily
  publisher: Publications Office of the European Union
  jurisdiction: [EU]
  categories: [procurement]
  homepage: https://ted.europa.eu/
  access_tier: public
  entity_levels: [named_company, opportunity]
  capabilities: [procurement, organizations, candidate_verification, authoritative_registry]
  # A notice names the winner, its country and what it supplied. It says nothing
  # about the company's size, footprint or trade volume, and nothing here
  # pretends otherwise.
  emits: [company_name, country, domain, buyer_role, product_term]
  countries: []
  sector_ids: []
  freshness_days: 7
  adapter_mode: live
  default_enabled: false
  health: active
  last_verified_at: '2026-08-20'
  license_note: >
    Free search API, no credential. Confirms that a company won or bid for an EU
    public contract; silent everywhere else, so it complements a web verifier
    rather than replacing one. Carries `authoritative_registry`: the publisher
    is the EU's Publications Office, so a notice satisfies a verdict's need for
    an authoritative source even though it is not the company's own page. A
    company with no website in the corpus has no other path to one.
- source_id: brightdata-web
  version: '1'
  display_name: Bright Data Web Unlocker
  publisher: Bright Data
  jurisdiction: [global]
  categories: [web, verification]
  homepage: https://brightdata.com/products/web-unlocker
  access_tier: credentialed_public
  entity_levels: [named_company]
  capabilities: [candidate_verification, web_evidence]
  # Substring matches against fetched pages, plus the closure phrases.
  emits: [company_name, country, domain, buyer_role, product_term, lifecycle_status]
  countries: []
  sector_ids: []
  freshness_days: 30
  adapter_mode: credential_required
  default_enabled: false
  health: active
  last_verified_at: '2026-08-20'
