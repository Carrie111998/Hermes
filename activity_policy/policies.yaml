enforcement: observe
activities:
  cron.postgres.sync:
    policy_version: 1
    owner: postgres
    aliases:
    - postgres-sync
    execution_class: S2
    quality_floor: standard
    preferred_models: &id001
    - deepseek/deepseek-v4-pro
    allowed_fallbacks: &id002
    - openai-codex/gpt-5.6-sol
    reasoning: &id003
      mode: adaptive
      effort: medium
    budgets: &id004
      max_turns: 30
      max_model_calls: 8
      max_uncached_input_tokens: 180000
      max_cache_read_tokens: 900000
      max_cache_write_tokens: 90000
      max_output_tokens: 30000
      max_reasoning_tokens: 60000
      max_tool_calls: 40
      wall_clock_seconds: 2400
      retries: 1
      max_children: 2
      max_child_depth: 1
      max_recorded_provider_cost_usd: '5.00'
      max_api_equivalent_cost_usd: '25.00'
    tools: &id005
      allow:
      - read_file
      deny:
      - merge
      - deploy
    outcome_contract: &id006
      required_artifacts: []
      required_validations:
      - factuality
    escalation: &id007
      'on':
      - quality_gate_failed
      - provider_unavailable
