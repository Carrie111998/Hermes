name: plan-secretary
version: 0.3.0
description: "Plan Secretary — capture assistant future-commitments (\"我接下来会…\") and inject pending-confirm / due reminders into the agent's next turn. promise_gate keeps the same turn going for immediate execute/register/cancel; a desktop pane shows real pending counts."
author: "Victor-lys"
provides_hooks:
  - promise_gate
  - post_llm_call
  - pre_llm_call
hooks:
