name: twilio-platform
label: Twilio
kind: platform
version: 1.0.0
description: >
  Outbound-only Twilio adapter for Hermes Agent, hosting two channels
  dispatched by target format: RCS (phone number, via a Twilio Messaging
  Service with an RCS Sender attached — Twilio automatically falls back
  to SMS/MMS for incapable recipients) and Email (email address, via
  Twilio's Email API). No inbound channel; use `hermes send` or cron
  `deliver=twilio` to send. Built to host more channels (SMS, MMS,
  WhatsApp, Voice) over time.

  Shares TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN with the built-in SMS
  platform and the optional telephony skill — Email uses the same
  credentials as RCS, not a separate key.
author: Hermes user
requires_env:
  - name: TWILIO_ACCOUNT_SID
    description: "Twilio Account SID (starts with AC) — shared with the SMS platform"
    prompt: "Twilio Account SID"
    password: false
  - name: TWILIO_AUTH_TOKEN
    description: "Twilio Auth Token — shared with the SMS platform"
    prompt: "Twilio Auth Token"
    password: true
  - name: TWILIO_MESSAGING_SERVICE_SID
    description: "Messaging Service SID (starts with MG) with an approved RCS Sender attached — required for the RCS channel"
    prompt: "Twilio Messaging Service SID"
    password: false
  - name: TWILIO_EMAIL_FROM
    description: "Default sender address for the Email channel — must be a verified sender identity for the Email product in the Twilio Console"
    prompt: "Sender email address"
    password: false
optional_env:
  - name: TWILIO_RCS_HOME_CHANNEL
    description: "Default destination phone number (E.164) for cron / notification delivery via RCS"
    prompt: "Home channel phone number (or empty)"
    password: false
  - name: TWILIO_EMAIL_FROM_NAME
    description: "Sender display name for the Email channel"
    prompt: "Sender display name (or empty)"
    password: false
  - name: TWILIO_EMAIL_API_BASE
    description: "Override the Email API base (default https://comms.twilio.com/v1/Emails)"
    prompt: "API base override (or empty for the public default)"
    password: false
  - name: TWILIO_EMAIL_HOME_CHANNEL
    description: "Default destination email address for cron / notification delivery via Email"
    prompt: "Home channel email address (or empty)"
    password: false
