name: bale-platform
label: Bale
kind: platform
version: 1.0.0
description: >
  Bale (بله) messenger gateway adapter for Hermes Agent.
  Connects to Bale via its Telegram-compatible Bot API using httpx
  (long polling). Supports text messages, markdown, and group chats.
  Bale is a popular Iranian messaging platform whose Bot API is a
  fork of Telegram's Bot API.
author: mohsen-fathi
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token from @bale_robot"
    prompt: "Bale bot token"
    password: true
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: BALE_ALLOW_ALL_USERS
    description: "Allow any Bale user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: BALE_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: BALE_HOME_CHANNEL_NAME
    description: "Display name for the Bale home channel"
    prompt: "Home channel display name"
    password: false
  - name: BALE_API_BASE_URL
    description: "Bale Bot API base URL (default: https://api.bale.ai)"
    prompt: "Bale API base URL"
    password: false