name: twilio_email-platform
label: Twilio Email
kind: platform
version: 1.0.0
description: >
  Outbound-only Twilio Email adapter for Hermes Agent (Twilio's Email API at
  comms.twilio.com -- One Console, not the older SendGrid v3 Mail Send API).
  No inbound channel; use `hermes send` or cron `deliver=twilio_email` to
  send. Supports image/document attachments. Uses the same core Twilio
  credentials as SMS/Voice (TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN).
author: Tweek 2026 hackathon
requires_env:
  - name: TWILIO_ACCOUNT_SID
    description: "Twilio Account SID -- shared with the sms plugin if already configured"
    prompt: "Twilio Account SID"
    url: "https://www.twilio.com/"
    password: false
  - name: TWILIO_AUTH_TOKEN
    description: "Twilio Auth Token -- shared with the sms plugin if already configured"
    prompt: "Twilio Auth Token"
    password: true
  - name: TWILIO_EMAIL_FROM
    description: "Default sender address -- must be a verified sender identity for the Email product in the Twilio Console"
    prompt: "Sender email address"
    password: false
optional_env:
  - name: TWILIO_EMAIL_FROM_NAME
    description: "Default sender display name"
    prompt: "Sender display name (or empty)"
    password: false
  - name: TWILIO_EMAIL_API_BASE
    description: "Override the Email API base (default https://comms.twilio.com/v1/Emails)"
    prompt: "API base override (or empty for the public default)"
    password: false
  - name: TWILIO_EMAIL_HOME_CHANNEL
    description: "Default destination email address for cron / notification delivery"
    prompt: "Home channel email (or empty)"
    password: false
