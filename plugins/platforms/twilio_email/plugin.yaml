name: twilio_email-platform
label: Twilio Email
kind: platform
version: 1.0.0
description: >
  Outbound-only Twilio Email adapter for Hermes Agent (SendGrid Mail Send
  API). No inbound channel; use `hermes send` or cron `deliver=twilio_email`
  to send. Twilio's Email API uses a separate credential surface from core
  Twilio (SMS/Voice/RCS) -- a SendGrid API key, not TWILIO_ACCOUNT_SID /
  TWILIO_AUTH_TOKEN.
author: Tweek 2026 hackathon
requires_env:
  - name: SENDGRID_API_KEY
    description: "SendGrid API key (starts with SG.) -- NOT the Twilio Account SID/Auth Token"
    prompt: "SendGrid API key"
    password: true
  - name: SENDGRID_FROM_EMAIL
    description: "Default sender address -- must be a Verified Sender or authenticated domain in SendGrid"
    prompt: "Sender email address"
    password: false
optional_env:
  - name: SENDGRID_FROM_NAME
    description: "Default sender display name"
    prompt: "Sender display name (or empty)"
    password: false
  - name: SENDGRID_API_BASE
    description: "Override API base -- e.g. https://api.staging.sendgrid.com/v3 for a progenitor/go_user staging test account"
    prompt: "API base override (or empty for public SendGrid)"
    password: false
  - name: SENDGRID_HOME_CHANNEL
    description: "Default destination email address for cron / notification delivery"
    prompt: "Home channel email (or empty)"
    password: false
