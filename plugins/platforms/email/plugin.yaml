name: email-platform
label: Email
kind: platform
version: 1.0.0
description: >
  Email gateway adapter for Hermes Agent. Polls an IMAP mailbox for inbound
  messages and replies over SMTP, relaying email threads to and from the
  Hermes agent.
author: NousResearch
requires_env:
  - name: EMAIL_ADDRESS
    description: "Email account address"
    prompt: "Email address"
    password: false
  - name: EMAIL_PASSWORD
    description: "Email account password / app password"
    prompt: "Email password"
    password: true
  - name: EMAIL_SMTP_HOST
    description: "SMTP host (e.g. smtp.gmail.com)"
    prompt: "SMTP host"
    password: false
optional_env:
  - name: EMAIL_SMTP_PORT
    description: "SMTP port (default 587)"
    prompt: "SMTP port"
    password: false
  - name: EMAIL_IMAP_HOST
    description: "IMAP host for inbound polling (e.g. imap.gmail.com)"
    prompt: "IMAP host"
    password: false
  - name: EMAIL_ALLOWED_USERS
    description: "Comma-separated email addresses allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: EMAIL_HOME_ADDRESS
    description: "Default address for cron / notification delivery"
    prompt: "Home address"
    password: false
  - name: EMAIL_AUTO_REPLY_PROMOTIONS
    description: "Allow promotional and marketing emails to reach the agent"
    prompt: "Auto-reply to promotions"
    password: false
  - name: EMAIL_AUTO_REPLY_NEWSLETTERS
    description: "Allow newsletters and digests to reach the agent"
    prompt: "Auto-reply to newsletters"
    password: false
  - name: EMAIL_AUTO_REPLY_TRANSACTIONS
    description: "Allow order, shipping, payment, and invoice notices to reach the agent"
    prompt: "Auto-reply to transaction notices"
    password: false
  - name: EMAIL_AUTO_REPLY_SECURITY
    description: "Allow verification and security notices to reach the agent"
    prompt: "Auto-reply to security notices"
    password: false
  - name: EMAIL_AUTO_REPLY_SOCIAL
    description: "Allow social-network notifications to reach the agent"
    prompt: "Auto-reply to social notifications"
    password: false
  - name: EMAIL_AUTO_REPLY_CALENDAR
    description: "Allow calendar invitations and reminders to reach the agent"
    prompt: "Auto-reply to calendar notices"
    password: false
  - name: EMAIL_AUTO_REPLY_REPORTS
    description: "Allow recurring reports to reach the agent"
    prompt: "Auto-reply to recurring reports"
    password: false
  - name: EMAIL_FORCE_REPLY_KEYWORDS
    description: "Semicolon-separated must-reply keyword groups; use + for all terms"
    prompt: "Must-reply keyword groups"
    password: false
  - name: EMAIL_NO_REPLY_KEYWORDS
    description: "Semicolon-separated no-reply keyword groups; use + for all terms"
    prompt: "No-reply keyword groups"
    password: false
  - name: EMAIL_REQUIRE_STRUCTURED_RESPONSE
    description: "Require and validate a structured need_response decision"
    prompt: "Require structured reply decisions"
    password: false
