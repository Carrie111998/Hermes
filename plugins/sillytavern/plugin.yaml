name: sillytavern
version: 0.1.0
description: Manage a local SillyTavern server (start/stop/status) and query its CSRF-aware HTTP API.
author: zapabob
config:
  install_dir:
    type: string
    default: "vendor/SillyTavern (repo submodule; override with SILLYTAVERN_DIR)"
  port:
    type: integer
    default: 8000
  host:
    type: string
    default: "127.0.0.1"
