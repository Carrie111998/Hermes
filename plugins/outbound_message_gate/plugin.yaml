name: outbound-message-gate
version: 1.0.0
description: "Fail-closed outbound URL and success-claim receipt gate for protected recipients."
author: "Paul Larche / Neo"
hooks:
  - post_tool_call
  - final_gateway_send_policy
config_schema:
  protected_targets:
    type: list
    default: []
  success_terms:
    type: list
    default: [fixed, working, resolved, live, ready, deployed, verified]
  fetch_timeout_seconds:
    type: float
    default: 10
  max_urls:
    type: int
    default: 8
  status_exceptions:
    type: list
    default: []
  allowed_verifiers:
    type: dict
    default: {}
