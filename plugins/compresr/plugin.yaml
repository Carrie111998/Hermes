name: compresr
version: 1.0.0
kind: backend
description: >-
  Query-aware context + tool-output compression via Compresr (YC W26).
  Out-of-tree, SDK-backed: all logic ships in the `compresr` PyPI package
  (compresr.integrations.hermes); this plugin is a thin shim. Cuts token cost
  of context compaction and large tool outputs. Fail-open, inert without an
  API key.
author: Compresr
homepage: https://compresr.ai
requires_env:
  - name: COMPRESR_API_KEY
    description: "Compresr API key (starts with cmp_)"
    url: "https://compresr.ai"
    secret: true
