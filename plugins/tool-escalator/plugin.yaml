name: tool-escalator
version: 1.0.0
description: "Auto-escalate to MoA (Mixture of Agents) when consecutive tool errors are detected. Tracks N consecutive errors (default 3), injects escalation context, and logs the decision."
author: "NousResearch"
hooks:
  - post_tool_call
  - pre_llm_call
  - post_llm_call
