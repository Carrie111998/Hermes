# ruff configuration for the Hermes agent fork.
#
# This file deliberately lives OUTSIDE pyproject.toml.  ruff reads ruff.toml in
# preference to pyproject.toml's [tool.ruff] and ignores the latter SILENTLY --
# no warning, no error -- so pyproject.toml must carry no [tool.ruff] table at
# all.  tests/test_lint_config.py asserts that, and asserts the select below.
#
# The reason for the split: the per-file-ignores sunset list at the bottom is
# several hundred lines and would more than double pyproject.toml, putting a
# large churning diff in the file that also holds dependencies, pytest markers
# and build config.  This file's whole purpose is to shrink to nothing.
#
# Design: docs/superpowers/specs/2026-08-16-ruff-f-group-reland-design.md

preview = true  # required for PLW1514 (unspecified-encoding) -- preview rule

[lint]
# Pyflakes "F" group, enforced project-wide (CI blocking job + pre-commit hook).
#
# F601 (multi-value-repeated-key-literal) was the seed rule -- it flags duplicate
# keys in a dict literal, which hit TOPIC_ROUTING in
# events/subscribers/telegram_notifier.py twice:
#   - 2026-04-26: 'agent_failure_cluster' declared twice with DIVERGENT values
#     ('watchdog_alerts' vs 'critic_proposals') -> silent live misrouting
#   - 2026-05-29: 'watchdog_burst' declared twice with identical values -> latent
#     footgun
# The rest of the F group was cleared and switched on afterwards (May 2026), and
# then fell out of main during the v0.15.1 cutover -- silently, with no named
# revert.  This is the re-land.  See the design doc for why the archive branch
# main-pre-0.15.1-cutover is a decision record and not a patch source.
#
# PLW1514 (unspecified-encoding): bare open()/read_text()/write_text() in text
# mode defaults to the system locale encoding on Windows (cp1252 on US-locale
# installs), which silently corrupts any non-ASCII file content.  Three separate
# Windows sandbox regressions in one debug session before this went in.
select = ["F", "PLW1514"]

[lint.per-file-ignores]
# --- Permanent exemptions -------------------------------------------------
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]
# Skills and plugins are partially user-authored -- their own conventions.
"skills/**" = ["PLW1514"]
"optional-skills/**" = ["PLW1514"]
"plugins/**" = ["PLW1514"]

# --- F-group sunset list --------------------------------------------------
# EMPTY.  Stages 2-5 burned it down from 544 entries to zero (2026-08-17).
#
# Every F rule is now clean tree-wide and gated in EVERY file with no exemption
# anywhere: a new F finding is a hard failure repo-wide.  Do not re-add an entry
# here to unblock a commit.
#
# When this block is empty, delete it and the marker comments with it.
