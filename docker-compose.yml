#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    # Localhost-only. For remote access, tunnel via `ssh -L 9119:localhost:9119`.
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]

  # Sandbox container used by profiles/sandbox (terminal.backend: docker).
  # Created 2026-08-30 per F7-A: thin python:3.12-slim image; /output mounts
  # the host's cache/documents/ so any files written from inside the container
  # appear on the host for review. restart: no — sandbox is started on demand
  # by the sandbox profile's terminal handler and torn down when the session
  # exits; do not make this `restart: unless-stopped` (it would interfere with
  # container_persistent: false semantics). Pin the image digest before going
  # to production; `python:3.12-slim` is a moving tag.
  #
  # Network policy (F7-A Option A, default N2 simplified 2026-08-30): sandbox
  # runs on the dedicated `sandbox-net` bridge with `internal: true`, which
  # strips the default gateway. That means no outbound network access — the
  # container can resolve DNS internally but cannot reach the internet or
  # host services. This matches SOUL.md bullet 3 ("no network egress beyond
  # docker-compose policy"). If a future task needs external API access, swap
  # the network attachment to a separate non-internal network on a per-call
  # basis (do NOT flip internal: false globally).
  #
  # Filesystem policy (F7-A Option A, default I2 2026-08-30):
  #   /output — write surface. Anything the sandbox writes here appears on the
  #             host at cache/documents/ for the agent to review.
  #   /input  — read-only mount of research/sandbox-inputs/. The agent drops
  #             test fixtures / vendor scripts here before invoking sandbox;
  #             sandbox reads them, runs them, writes results to /output.
  #             Anything not in this folder is invisible to the sandbox.
  sandbox:
    image: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
    container_name: hermes-sandbox
    restart: "no"
    networks:
      - sandbox-net
    volumes:
      - C:\\Users\\bbask\\AppData\\Local\\hermes\\cache\\documents:/output
      - C:\\Users\\bbask\\Hermes-Workspace\\research\\sandbox-inputs:/input:ro
    command: ["sh", "-c", "trap 'exit 0' TERM INT; while true; do sleep 3600; done"]

networks:
  # F7-A Option A: dedicated bridge with no gateway. The sandbox can reach
  # nothing outside the container (no internet, no host services). To grant
  # egress for a specific test, attach this container to a second non-internal
  # network on the command line, NOT by flipping this flag.
  sandbox-net:
    driver: bridge
    internal: true
