<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultra Studio Agent</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f3efe4;
        --muted: #a8a09a;
        --dim: #716c68;
        --line: rgba(243, 239, 228, 0.14);
        --line2: rgba(243, 239, 228, 0.24);
        --canvas: #0d0f10;
        --rail: rgba(23, 25, 26, 0.9);
        --field: #111314;
        --cyan: #8bdde3;
        --green: #9fd18b;
        --brass: #d7a94e;
        --red: #e1614f;
        --plum: #7f6df2;
        --lime: #b7ff2a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; color: var(--ink); background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 78% 12%, rgba(139,221,227,.12), transparent 28rem),
        radial-gradient(circle at 12% 86%, rgba(215,169,78,.08), transparent 24rem),
        var(--canvas); background-size: 18px 18px, 18px 18px, auto, auto, auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      button, textarea, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .45; }
      svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }
      .shell { display: grid; grid-template-columns: minmax(14rem,17rem) minmax(0,1fr) minmax(16rem,21rem); min-height: 100vh; }
      .rail, .inspector { background: var(--rail); border-color: var(--line); backdrop-filter: blur(16px); }
      .rail { display: flex; flex-direction: column; gap: 1.2rem; padding: 1.2rem; border-right: 1px solid var(--line); }
      .brand { display: flex; min-width: 0; align-items: center; gap: .8rem; }
      .brand-mark { flex: 0 0 auto; width: 3.5rem; height: 3.5rem; padding: .16rem; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.48); border-radius: .7rem; box-shadow: 0 .7rem 1.8rem rgba(0,0,0,.38); }
      .brand-mark img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: .55rem; }
      .brand-copy { min-width: 0; }
      .brand strong, .brand small { display: block; }
      .brand strong { color: #d8d7d4; font-size: 1.12rem; line-height: 1.05; white-space: nowrap; }
      .brand strong span { color: var(--lime); }
      .brand small { margin-top: .28rem; color: var(--muted); font-size: .72rem; }
      .rail-action, .icon-button, .prompt-action { color: var(--ink); background: rgba(255,255,255,.055); border: 1px solid var(--line); border-radius: .5rem; }
      .rail-action { display: flex; align-items: center; gap: .7rem; width: 100%; padding: .8rem .85rem; }
      .rail-action:hover, .icon-button:hover:not(:disabled), .prompt-action:hover { color: var(--cyan); border-color: rgba(139,221,227,.5); }
      .history-panel { display: flex; min-height: 0; flex-direction: column; gap: .55rem; }
      .history-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
      .history-head h2 { margin: 0; color: var(--dim); font-size: .68rem; text-transform: uppercase; }
      .history-refresh { display: inline-grid; width: 1.9rem; height: 1.9rem; place-items: center; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: .45rem; }
      .history-refresh svg { width: .95rem; height: .95rem; }
      .history-list { display: grid; max-height: min(42vh,22rem); gap: .45rem; overflow-y: auto; }
      .history-empty { padding: .7rem; color: var(--dim); border: 1px dashed var(--line); border-radius: .45rem; font-size: .72rem; }
      .history-item { display: grid; width: 100%; gap: .24rem; padding: .65rem .7rem; color: var(--muted); text-align: left; background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: .45rem; }
      .history-item:hover:not(:disabled), .history-item[data-active="true"] { color: var(--ink); border-color: rgba(183,255,42,.42); background: rgba(183,255,42,.07); }
      .history-title, .history-preview, .history-meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .history-title { color: var(--ink); font-size: .78rem; }
      .history-preview { font-size: .7rem; }
      .history-meta { color: var(--dim); font-size: .64rem; }
      .session-facts { display: grid; gap: .75rem; margin: 0; }
      .session-facts div, .meter { min-width: 0; padding: .8rem; background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: .45rem; }
      .session-facts dt, .meter span, .eyebrow { margin: 0 0 .4rem; color: var(--dim); font-size: .68rem; text-transform: uppercase; }
      .session-facts dd, .meter strong { display: block; min-width: 0; margin: 0; overflow: hidden; color: var(--ink); font-size: .86rem; text-overflow: ellipsis; white-space: nowrap; }
      .workspace { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.2rem 1.4rem; border-bottom: 1px solid var(--line); }
      .topbar h1 { margin: 0; font-size: clamp(1.25rem,2vw,1.75rem); letter-spacing: 0; }
      .runtime-strip { display: flex; align-items: center; gap: .55rem; }
      .status-pill { display: inline-flex; align-items: center; gap: .5rem; max-width: 18rem; padding: .55rem .75rem; color: var(--muted); background: rgba(255,255,255,.045); border: 1px solid var(--line); border-radius: 999px; font-size: .78rem; }
      .status-dot { width: .55rem; height: .55rem; background: var(--brass); border-radius: 999px; }
      .status-pill[data-state="open"] .status-dot { background: var(--green); }
      .status-pill[data-state="error"] .status-dot, .status-pill[data-state="closed"] .status-dot { background: var(--red); }
      .icon-button { display: inline-grid; width: 2.55rem; height: 2.55rem; place-items: center; }
      .error-banner { margin: 1rem 1.4rem 0; padding: .8rem 1rem; overflow-wrap: anywhere; color: #ffd2cc; background: rgba(225,97,79,.13); border: 1px solid rgba(225,97,79,.38); border-radius: .45rem; }
      .messages { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: .75rem; padding: 1.4rem; overflow-y: auto; }
      .empty-state, .empty-tools { display: grid; min-height: 10rem; place-items: center; color: var(--dim); border: 1px dashed var(--line); border-radius: .5rem; }
      .message { width: min(48rem,92%); padding: .85rem .95rem; background: rgba(255,255,255,.045); border: 1px solid var(--line); border-radius: .55rem; }
      .message.user { align-self: flex-end; border-color: rgba(139,221,227,.3); background: rgba(139,221,227,.08); }
      .message.assistant { align-self: flex-start; border-color: rgba(215,169,78,.24); }
      .message.system, .message.tool { width: min(40rem,86%); color: var(--muted); background: rgba(127,109,242,.08); }
      .message[data-streaming="true"] { border-color: rgba(159,209,139,.35); }
      .message-label { margin-bottom: .45rem; color: var(--dim); font-size: .68rem; text-transform: uppercase; }
      .message-body, .message-copy, .tool-card p, .pending-panel p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.58; }
      .message-copy { min-width: 0; }
      .message-link { color: var(--cyan); text-decoration: none; border-bottom: 1px solid rgba(139,221,227,.35); }
      .message-link:hover { border-bottom-color: var(--cyan); }
      .stream-placeholder { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); }
      .stream-placeholder::after { content: ""; width: .45rem; height: .45rem; background: var(--green); border-radius: 999px; animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
      .media-preview { display: grid; gap: .45rem; margin-top: .7rem; }
      .media-preview video, .media-preview img { max-width: min(28rem,100%); max-height: 18rem; background: #000; border: 1px solid var(--line); border-radius: .45rem; object-fit: contain; }
      .message-attachments { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .55rem; }
      .message-attachments span { max-width: 16rem; padding: .25rem .45rem; overflow: hidden; color: var(--cyan); border: 1px solid rgba(139,221,227,.25); border-radius: 999px; font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
      .pending-panel { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; margin: 0 1.4rem 1rem; padding: .85rem; background: rgba(215,169,78,.1); border: 1px solid rgba(215,169,78,.35); border-radius: .5rem; }
      .pending-panel[hidden], .attachment-shelf[hidden] { display: none; }
      .pending-panel input { min-width: min(18rem,100%); padding: .65rem .75rem; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: .45rem; }
      .prompt-action { padding: .6rem .75rem; }
      .composer { margin: 0 1.4rem 1.3rem; padding: .65rem; background: rgba(26,28,29,.94); border: 1px solid var(--line2); border-radius: .65rem; box-shadow: 0 1rem 3rem rgba(0,0,0,.45); }
      .composer.drop-active { border-color: var(--cyan); }
      .composer-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: end; gap: .55rem; }
      .composer textarea { width: 100%; min-height: 2.55rem; max-height: 11.25rem; padding: .7rem .15rem; resize: none; color: var(--ink); background: transparent; border: 0; outline: none; line-height: 1.45; }
      .composer textarea::placeholder { color: var(--dim); }
      .icon-button.send { color: #071113; background: var(--cyan); border-color: var(--cyan); }
      .attachment-shelf { display: flex; flex-wrap: wrap; gap: .55rem; padding: 0 0 .6rem; }
      .attachment-chip { display: inline-flex; align-items: center; min-width: 0; max-width: 100%; gap: .55rem; padding: .4rem .5rem; background: rgba(139,221,227,.08); border: 1px solid rgba(139,221,227,.28); border-radius: .45rem; }
      .attachment-chip img { width: 2rem; height: 2rem; object-fit: cover; border-radius: .3rem; }
      .attachment-chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .attachment-chip button { width: 1.45rem; height: 1.45rem; color: var(--muted); background: transparent; border: 0; }
      .inspector { display: flex; flex-direction: column; gap: 1rem; min-width: 0; padding: 1.2rem; border-left: 1px solid var(--line); overflow-y: auto; }
      .inspector h2 { margin: 0 0 .7rem; color: var(--muted); font-size: .76rem; text-transform: uppercase; }
      .inspector section:first-child, .tools-list { display: grid; gap: .65rem; }
      .tool-card { min-width: 0; padding: .75rem; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-left: 3px solid var(--brass); border-radius: .45rem; }
      .tool-card[data-status="done"] { border-left-color: var(--green); }
      .tool-card[data-status="error"] { border-left-color: var(--red); }
      .tool-title, .tool-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tool-title { font-size: .85rem; }
      .tool-meta { margin: .35rem 0; color: var(--dim); font-size: .72rem; }
      .tool-card p { color: var(--muted); font-size: .78rem; }
      @media (max-width: 1040px) { .shell { grid-template-columns: minmax(12rem,15rem) minmax(0,1fr); } .inspector { display: none; } }
      @media (max-width: 760px) { .shell { display: block; } .rail { display: none; } .workspace { height: 100vh; } .topbar { align-items: flex-start; padding: 1rem; } .runtime-strip { flex-wrap: wrap; justify-content: flex-end; } .messages { padding: 1rem; } .message, .message.system, .message.tool { width: 100%; } .composer { margin: 0 1rem 1rem; } }
    </style>
  </head>
  <body>
    <div id="app" class="shell">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark">
            <img src="/atlas-avatar.png" alt="" />
          </span>
          <span class="brand-copy">
            <strong><span>Bringing</span> it to life</strong>
            <small>Ultra Studio Agent</small>
          </span>
        </div>

        <button id="new-session" class="rail-action" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>New Session</span>
        </button>

        <section class="history-panel" aria-labelledby="history-heading">
          <div class="history-head">
            <h2 id="history-heading">History</h2>
            <button id="refresh-history" class="history-refresh" type="button" title="Refresh history">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20 12a8 8 0 0 1-13.7 5.6M4 12A8 8 0 0 1 17.7 6.4" />
                <path d="M7 18H4v3M17 6h3V3" />
              </svg>
            </button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>

        <dl class="session-facts">
          <div>
            <dt>Transport</dt>
            <dd id="connection-state">idle</dd>
          </div>
          <div>
            <dt>Model</dt>
            <dd id="model-label">pending</dd>
          </div>
          <div>
            <dt>Session</dt>
            <dd id="session-label">pending</dd>
          </div>
        </dl>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Ultra Studio Agent</p>
            <h1>Creative Session</h1>
          </div>
          <div class="runtime-strip">
            <span id="status-pill" class="status-pill" data-state="idle">
              <span class="status-dot"></span>
              <span id="status-label">idle</span>
            </span>
            <button id="interrupt-button" class="icon-button" type="button" title="Stop run" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="7" y="7" width="10" height="10" rx="1.5" />
              </svg>
            </button>
            <button id="reconnect-button" class="icon-button" type="button" title="Reconnect">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20 12a8 8 0 0 1-13.7 5.6M4 12A8 8 0 0 1 17.7 6.4" />
                <path d="M7 18H4v3M17 6h3V3" />
              </svg>
            </button>
          </div>
        </header>

        <section id="error-banner" class="error-banner" hidden></section>
        <section id="messages" class="messages" aria-live="polite"></section>
        <section id="pending-panel" class="pending-panel" hidden></section>

        <form id="composer" class="composer">
          <div id="attachment-shelf" class="attachment-shelf" hidden></div>
          <div class="composer-row">
            <button id="attach-button" class="icon-button attach" type="button" title="Attach image">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.3-9.3a4 4 0 0 1 5.7 5.7l-9.4 9.4a2 2 0 0 1-2.8-2.8l8.8-8.8" />
              </svg>
            </button>
            <textarea id="prompt-input" rows="1" placeholder="Message"></textarea>
            <button id="send-button" class="icon-button send" type="submit" title="Send" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
          <input id="image-input" type="file" accept="image/*" hidden />
        </form>
      </main>

      <aside class="inspector">
        <section>
          <h2>Run</h2>
          <div class="meter">
            <span>State</span>
            <strong id="run-state">idle</strong>
          </div>
          <div class="meter">
            <span>Provider</span>
            <strong id="provider-label">gateway</strong>
          </div>
        </section>
        <section>
          <h2>Tools</h2>
          <div id="tools-list" class="tools-list"></div>
        </section>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
