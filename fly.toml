# Fly.io deployment for the interfaze-agent Sales Agent API.
#
#   fly launch --no-deploy --copy-config    # creates the app, keeps this file
#   fly volumes create interfaze_data --region fra --size 3
#   fly secrets set ...                     # see server/README.md
#   fly deploy
#
# Secrets are NOT listed here — `fly secrets` stores them encrypted and injects
# them as env vars at boot. Anything in [env] below is world-readable in git.

app = "agent-rota"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.interfaze-api"

[env]
  INTERFAZE_HOST = "0.0.0.0"
  INTERFAZE_PORT = "8000"
  INTERFAZE_LOG_FORMAT = "json"

[http_service]
  internal_port = 8000
  force_https = true
  # Agent runs are `hermes` subprocesses that outlive the HTTP request that
  # started them, and chat replies stream over SSE. A machine suspended between
  # requests would kill both mid-flight, so this app stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[mounts]
  source = "interfaze_data"
  destination = "/data"

# HERMES_HOME=/data, so ~/.hermes/config.yaml is /data/config.yaml on this
# volume — that is where interfaze_server settings (auth_mode, chat_model,
# cors_origins) live. It is not in the image; write it on first boot.
#
# ponytail: one machine, one volume. Documents land on that volume unless
# SUPABASE_SERVICE_ROLE_KEY is set; set it before scaling past one machine or
# uploads will diverge per-machine.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
