# Ideation Pipeline — Research → Spec → Security → Domain Decomposition
#
# Derived from: docs/agents/hopper/reports/fleet-project-pipeline.md (canonical, 2026-06-06)
# Updated: Ada security moved to Phase 5a — gate after spec, before decomposition.
# Updated: Domain-organized specs (v3) — decomposition follows domain boundaries.
#
# Phases 1-7 of the 9-phase fleet pipeline. Domain parallelism emerges
# naturally from the ## Domain Dependency Graph in SPEC.md.
#
# DAG:
#   nikola-research ──┐
#   sherlock-setup ───┼── nikola-artifacts ── edison-spec ── nikola-verify-spec ──┐
#                     │                                                          │
#                     └──────────────────────────────────────────────────────────┘
#                                              ↓
#   edison-revise-spec ──┘ (loop: back to nikola-verify-spec if rejected)
#
#   ada-security ──┐  ← Security gate on cross-cutting + per-domain specs
#                  │     Review both SPEC.md and domains/*/SPEC.md.
#                  │
#   nikola-decompose ── edison-verify-cards ──┐
#                                              ↓
#   edison-revise-cards ──┘ (loop: back to edison-verify-cards if rejected)
#
# Output: Security-approved task cards organized by domain, ready for Newton.

name: ideation
description: >
  Phases 2-7 of the fleet project pipeline. Nikola researches and produces
  artifacts. Edison writes the spec. Nikola verifies. Ada gates the spec
  for security before decomposition. Nikola decomposes into task cards.
  Edison verifies the cards. Output: approved task cards ready for Newton.
  Ada reviews the SPEC (architecture, data flow, auth, encryption) before
  any decomposition — catching security flaws early avoids wasted work.

trigger_events:
  - project_start     # Triggered when Randy says "start"
  - workflow_dispatch

nodes:

  # ── Phase 2: Research ──
  # Happens in parallel with ideation. By the time Randy says "start,"
  # Nikola's research is ready for synthesis.
  nikola-research:
    agent: nikola
    task: >
      Research the tools, technologies, and patterns in the project context.
      Investigate: what frameworks are appropriate? What APIs exist?
      What are competitors using? What are the technical constraints?
      Produce research findings for synthesis into reference.md.
      This phase can begin during ideation — research in parallel.
    timeout_minutes: 45
    channel: orchestration

  # ── Phase 3: Project Setup ──
  # Sherlock creates the channel (if new), synthesizes all notes from
  # ideation, and prepares context for Nikola. Triggered ONLY by Randy's
  # "start" signal — never from Penny relay.
  sherlock-setup:
    agent: sherlock
    task: >
      Project setup. Create project channel if new. Synthesize all ideation
      context (Penny's intent summaries, research findings, Randy's voice
      messages). Prepare the full context package for Nikola. Verify the
      "start" signal came directly from Randy — not relayed through Penny.
    timeout_minutes: 30
    channel: orchestration

  # ── Phase 4: Artifact Generation ──
  # Nikola produces reference.md (external research, relevant information,
  # requirements) and project.md (problem statement, target users, goals).
  nikola-artifacts:
    agent: nikola
    task: >
      Produce two artifacts from the synthesized context and research:
      1. reference.md — external research, relevant information, technical
         requirements, constraints, API documentation references.
      2. project.md — problem statement, target users, what the project aims
         to solve, success criteria.
      Output to the project's spec directory. These artifacts are the
      foundation for Edison's spec.
    depends_on:
      - nikola-research
      - sherlock-setup
    timeout_minutes: 60
    channel: orchestration

  # ── Phase 5: Specification ──
  # Edison generates the formal SPEC.md from Nikola's artifacts.
  # Nikola verifies it against original requirements.
  # Back-and-forth revision until the spec matches requirements.

  edison-spec:
    agent: edison
    task: >
      Generate the formal SPEC.md from Nikola's reference.md and project.md.
      Define: architecture decisions, data flow, component interfaces,
      edge cases, acceptance criteria, constraints, breaking changes.
      The spec must be implementable without re-litigating intent.
      Output: SPEC.md in the project's spec directory.
      STANDARD: Per your AGENTS.md → Governing Standard.
    depends_on:
      - nikola-artifacts
    timeout_minutes: 60
    channel: orchestration

  nikola-verify-spec:
    agent: nikola
    task: >
      Verify Edison's SPEC.md against the original requirements in
      reference.md and project.md. Check: does every requirement have
      a corresponding spec section? Are edge cases covered? Are
      acceptance criteria testable? Return APPROVED (proceed to
      security review) or REVISIONS (back to Edison with specifics).
      STANDARD: Per your AGENTS.md — load and use the spec quality rubric.
      Any ❌ = REVISIONS.
    depends_on:
      - edison-spec
    timeout_minutes: 30
    channel: orchestration

  edison-revise-spec:
    agent: edison
    task: >
      Revise SPEC.md per Nikola's feedback. Address every item in the
      revision request. If Nikola approved (no revisions), confirm
      and exit. Resubmit to Nikola for re-verification.
    depends_on:
      - nikola-verify-spec
    timeout_minutes: 30
    channel: orchestration

  # ── Phase 5a: Security Review of the Spec ──
  # Ada reviews the SPEC for security before any task cards exist.
  # This gates decomposition: if the spec has architectural security
  # flaws, catch them here — not after cards are written.
  ada-security:
    agent: ada
    task: >
      Security review of Edison's finalized spec. Review at two levels:
      1. Cross-cutting (SPEC.md): dependency audit, auth strategy, tooling,
         API conventions, deployment surface, secret handling.
      2. Per-domain (domains/*/SPEC.md): domain-specific data flow, interfaces,
         PII exposure per domain, domain-specific attack surface.
      This review gates before decomposition — security flaws in the
      spec would make all task cards invalid. Return APPROVED or
      BLOCKED with specific findings per domain. Nikola
      must not begin decomposition until this gate clears.
      STANDARD: Per your AGENTS.md. Use severity levels, output template,
      and approval threshold. Phase 5a mode: spec-level review.
    depends_on:
      - edison-revise-spec
    timeout_minutes: 30
    channel: orchestration

  # ── Phase 6: Task Decomposition ──
  # Nikola decomposes the security-approved spec into implementable
  # task cards, one domain at a time. Domain parallelism emerges from
  # the ## Domain Dependency Graph in SPEC.md.
  # Edison verifies the cards against domain specs.
  # Back-and-forth until cards match specs.

  nikola-decompose:
    agent: nikola
    task: >
      Decompose the security-approved spec into task cards, organized by
      domain per the ## Domain Dependency Graph in SPEC.md. For each domain:
      read domains/<name>/SPEC.md, produce task cards into
      domains/<name>/tasks/TASK-<N>.md. Each card must: be independently
      completable, have clear acceptance criteria from the domain spec,
      be sized for a single PR, declare intra-domain dependencies.
      Reference the domain scope — Newton should never load other domains.
      Populate the project's kanban board with domain-grouped cards.
    depends_on:
      - ada-security
    timeout_minutes: 45
    channel: orchestration

  edison-verify-cards:
    agent: edison
    task: >
      Verify Nikola's task cards against the domain specs. Per domain:
      do the task cards cover every section of domains/<name>/SPEC.md?
      Is intra-domain dependency order correct? Are acceptance criteria
      faithfully translated from the domain spec? Return APPROVED
      (proceed) or REVISIONS (back to Nikola with per-domain specifics).
    depends_on:
      - nikola-decompose
    timeout_minutes: 20
    channel: orchestration

  edison-revise-cards:
    agent: edison
    task: >
      Request card revisions from Nikola per verification findings.
      Address gaps, ordering issues, or acceptance criteria mismatches.
      If cards were approved, confirm and exit.
    depends_on:
      - edison-verify-cards
    timeout_minutes: 15
    channel: orchestration
