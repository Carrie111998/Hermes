# Ideation Pipeline — Spec → Validate → Decompose → Task Cards
#
# This is the discovery/planning phase. The spec is the contract.
# Once the spec is solid and decomposed into tasks, Newton implements.
#
# Pipeline:
#   edison-spec → ada-security → nikola-validate → edison-revise → nikola-decompose → edison-verify

name: ideation
description: >
  Ideation pipeline from concept to task cards. Edison writes the spec.
  Ada reviews for security standards. Nikola validates against requirements.
  Edison revises. Nikola decomposes into task cards. Edison verifies the
  cards. Output: validated spec + decomposed task cards ready for Newton.

trigger_events:
  - project_start
  - feature_request
  - workflow_dispatch

nodes:

  # ── Phase 1: Draft Spec ──
  edison-spec:
    agent: edison
    task: >
      Write the implementation spec. Reference the project requirements
      and any existing SPEC.md. Define: architecture decisions, data flow,
      interfaces, edge cases, acceptance criteria, constraints, and any
      breaking changes. This spec is the contract — all subsequent phases
      measure against it. Output to docs/specs/{feature}.md.
    timeout_minutes: 60
    channel: orchestration

  # ── Phase 2: Security Review ──
  ada-security-review:
    agent: ada
    task: >
      Review Edison's spec for security implications. Check: authentication
      patterns, data exposure, injection vectors, dependency risks, secret
      handling, network egress, WAF posture. File findings. The spec should
      not proceed to Nikola with unresolved security concerns.
    depends_on:
      - edison-spec
    timeout_minutes: 30
    channel: orchestration

  # ── Phase 3: Validate Spec ──
  nikola-validate:
    agent: nikola
    task: >
      Validate Edison's spec against the project requirements (reference.md,
      project charter, or stated goals). Check: does the spec address every
      requirement? Are edge cases covered? Are acceptance criteria testable?
      Is scope correct (no gold-plating, no missing features)? Return one of:
      APPROVED (proceed to decompose) or REVISIONS (back to Edison with
      specific feedback).
    depends_on:
      - ada-security-review
    timeout_minutes: 30
    channel: orchestration

  # ── Phase 4: Revise Spec (conditional) ──
  edison-revise:
    agent: edison
    task: >
      Revise the spec per Nikola's feedback. Address every item in the
      revision request. If no revisions requested (Nikola approved),
      confirm and exit. Resubmit to Nikola for re-validation.
    depends_on:
      - nikola-validate
    timeout_minutes: 30
    channel: orchestration

  # ── Phase 5: Decompose into Task Cards ──
  nikola-decompose:
    agent: nikola
    task: >
      Decompose the approved spec into discrete task cards. Each card must:
      - Be independently completable by Newton
      - Have clear acceptance criteria from the spec
      - Be sized to fit within a single PR
      - Include dependencies on other cards if applicable
      Output: kanban board populated with task cards, each referencing
      the spec section it implements.
    depends_on:
      - edison-revise
    timeout_minutes: 45
    channel: orchestration

  # ── Phase 6: Verify Task Cards ──
  edison-verify:
    agent: edison
    task: >
      Verify Nikola's task decomposition against the spec. Check: do the
      cards cover every section of the spec? Is the dependency order
      correct? Are acceptance criteria faithfully translated? Approve
      or flag gaps. Once approved, Newton can begin implementation.
    depends_on:
      - nikola-decompose
    timeout_minutes: 20
    channel: orchestration
