# Feature Development Workflow — Execution Pipeline (post-ideation)
#
# Derived from:
#   - CI-TEMPLATE.md (canonical, 2026-06-03) — PR lifecycle, dual-approval gate, post-merge actions
#   - delivery-pipeline.md (canonical, 2026-05-23) — branching model, deploy, Raven QA gate
#   - pr-review-pipeline.md (2026-03-31) — Nikola spec gate replaced by Sherlock per CI template
#
# Preceded by: ideation pipeline (edison-spec → ada-security → sprite-designs →
#   nikola-decompose → edison-verify). Sprite's design work is complete —
#   stitch_project IDs are in task cards. Newton extracts HTML/CSS from Stitch.
#
# Newton starts when task cards from ideation are ready.
#
# DAG:
#   newton-build ── ci-green ── sherlock-review ──┬── merge ──┬── nikola-state
#                             └── raven-review ───┘           ├── raven-regression
#                                                              ├── newton-teardown
#                                                              └── ada-security

name: feature-dev
description: >
  Execution pipeline from task cards to merge. Newton builds from
  design-complete task cards (stitch_project IDs included from ideation).
  CI gates quality, Sherlock+Raven dual-approve, post-merge quartet
  handles state/regression/teardown/security. Preceded by ideation pipeline.

trigger_events:
  - pr_opened
  - workflow_dispatch  # Triggered when ideation pipeline completes

nodes:

  # ── Phase 1: Build ──
  # Newton implements from task cards. Sprite's design work was completed
  # during ideation Phase 5b — stitch_project IDs are already in task cards.
  # Newton extracts HTML/CSS from Stitch via get_screen_code.

  newton-build:
    agent: newton
    task: >
      Implement the feature per the task cards from ideation. Task cards
      from Nikola already include stitch_project + stitch_screen_id.
      Extract HTML/CSS from Stitch via get_screen_code(screen_id) before building.
      Branch from development: feat/{feature}. Follow TDD — tests before
      implementation. Ensure CI passes locally before pushing. Open PR
      to development with auto-merge enabled. Do NOT tag Raven directly —
      the pipeline routes through Sherlock and Nikola.
    timeout_minutes: 120
    channel: orchestration

  # ── Phase 2: CI Gate (mechanical) ──
  # CI runs on PR. CI bot notifies Sherlock + Raven on green.
  # On failure: routes back to Newton. This node represents "CI passed."
  ci-green:
    agent: sherlock  # Sherlock monitors CI, triggers next phase on green
    task: >
      Monitor CI for this PR. On green: advance to review phase.
      On failure: route back to Newton with failure details.
      On conflict: flag Newton for rebase.
    depends_on:
      - newton-build
    timeout_minutes: 30
    channel: orchestration

  # ── Phase 3: Dual Approval Gate (parallel) ──
  # Sherlock checks spec compliance + scope. Raven checks product reality + regression.
  # Both must approve. They work in parallel.

  sherlock-review:
    agent: sherlock
    task: >
      Review PR for spec compliance and scope. Check: does the implementation
      match Edison's spec? Are acceptance criteria satisfied? Is the scope correct
      (no creeping features, no missing requirements)? Approve or request changes.
      If approving and Raven hasn't approved yet: tag Raven with signal.
    depends_on:
      - ci-green
    timeout_minutes: 30
    channel: orchestration

  raven-review:
    agent: raven
    task: >
      Review PR for product reality and regression. Check: code quality, test
      coverage, edge cases, UI consistency (against domain spec acceptance criteria),
      performance regressions. Run E2E via Playwright if PR touches UI.
      Approve or request changes. Both Sherlock AND Raven must approve for merge.
      Wait for BOTH signals: Sherlock's approval + CI green.
    depends_on:
      - ci-green
    timeout_minutes: 45
    channel: orchestration

  # ── Phase 4: Merge Gate ──
  # Both approvals in → auto-merge fires (branch protection: 2 required reviewers).
  # This node represents the merge-complete signal.
  merge:
    agent: sherlock
    task: >
      Verify both approvals received (Sherlock + Raven). Confirm CI green.
      Auto-merge fires when both conditions met. Mark PR as complete.
      Trigger post-merge actions.
    depends_on:
      - sherlock-review
      - raven-review
    timeout_minutes: 10
    channel: orchestration

  # ── Phase 5: Post-Merge Actions (parallel) ──
  # Four agents each have post-merge responsibilities per CI template.
  # All fire in parallel after merge.

  nikola-state:
    agent: nikola
    task: >
      Fold the completed work into STATE.md and the relevant domain _index.md.
      Update project documentation to reflect the merged changes. This is
      librarian motion — no code changes, documentation only.
    depends_on:
      - merge
    timeout_minutes: 20
    channel: orchestration

  raven-regression:
    agent: raven
    task: >
      Run regression / smoke pass against the merged change. Hit the dev
      environment (dev.<project>.mcclean.codes). Verify no regressions
      in primary user flows. File issues for any failures.
    depends_on:
      - merge
    timeout_minutes: 30
    channel: orchestration

  newton-teardown:
    agent: newton
    task: >
      Tear down the worktree and any project-side scaffolding created during
      this feature. Clean up feature branch (delete after merge). Remove
      temporary assets, test fixtures, or debug artifacts.
    depends_on:
      - merge
    timeout_minutes: 15
    channel: orchestration

  ada-security:
    agent: ada
    task: >
      Run dependency scan and secret scan on the merge diff. Check for:
      new dependencies with known vulnerabilities, accidentally committed
      secrets, unsafe patterns introduced in the PR. File issues for
      any findings.
    depends_on:
      - merge
    timeout_minutes: 20
    channel: orchestration
