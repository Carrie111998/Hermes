<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="完整系统建设总图">
<style>
.bg{fill:#fffdf8}.box{fill:#fff7e8;stroke:#d9cfbd;stroke-width:2}.p0{fill:#edf8fa;stroke:#80b9c4;stroke-width:2}.p1{fill:#f1fbf3;stroke:#8ebd98;stroke-width:2}.p2{fill:#f6f0ff;stroke:#bba4d9;stroke-width:2}.risk{fill:#fff0ee;stroke:#d99a94;stroke-width:2}.external{fill:#edf5fb;stroke:#83b2d1;stroke-width:2}.text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#1d1e1a}.muted{fill:#66635d}.title{font-size:24px;font-weight:750}.label{font-size:15px;font-weight:750}.small{font-size:12px}.tiny{font-size:11px}.arrow{stroke:#7a746a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.line{stroke:#d9cfbd;stroke-width:2;fill:none}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7a746a"/></marker></defs>
<rect class="bg" width="1280" height="620" rx="20"/>
<text class="text title" x="36" y="46">完整系统建设总图</text>
<text class="text small muted" x="36" y="72">从用户界面到模型提供商，所有状态都必须有 owner。</text>
<g transform="translate(42,112)">
<rect class="p0" x="0" y="0" width="210" height="130" rx="14"/><text class="text label" x="20" y="34">Product Shell</text><text class="text small muted" x="20" y="62">Left Nav / Chat</text><text class="text small muted" x="20" y="84">Inspector / Tasks</text><text class="text small muted" x="20" y="106">Files / Memory</text>
<path class="arrow" d="M220 65 H280"/>
<rect class="p0" x="290" y="0" width="210" height="130" rx="14"/><text class="text label" x="310" y="34">Gateway / Session</text><text class="text small muted" x="310" y="62">session.create</text><text class="text small muted" x="310" y="84">prompt.submit</text><text class="text small muted" x="310" y="106">event stream</text>
<path class="arrow" d="M510 65 H570"/>
<rect class="p0" x="580" y="0" width="210" height="130" rx="14"/><text class="text label" x="600" y="34">Agent Runtime</text><text class="text small muted" x="600" y="62">router / skills</text><text class="text small muted" x="600" y="84">tool calls</text><text class="text small muted" x="600" y="106">prompt compiler</text>
<path class="arrow" d="M800 65 H860"/>
<rect class="p1" x="870" y="0" width="210" height="130" rx="14"/><text class="text label" x="890" y="34">Media Jobs</text><text class="text small muted" x="890" y="62">create / status</text><text class="text small muted" x="890" y="84">poll / finalize</text><text class="text small muted" x="890" y="106">asset 来源链路</text>
<path class="arrow" d="M1090 65 H1148"/>
<rect class="external" x="1158" y="0" width="80" height="130" rx="14"/><text class="text label" x="1176" y="40">Atlas</text><text class="text tiny muted" x="1174" y="72">image</text><text class="text tiny muted" x="1174" y="94">video</text>
<rect class="box" x="0" y="190" width="210" height="130" rx="14"/><text class="text label" x="20" y="224">Asset Library</text><text class="text small muted" x="20" y="252">media_input</text><text class="text small muted" x="20" y="274">image_job / video_job</text><text class="text small muted" x="20" y="296">element / character</text>
<rect class="box" x="290" y="190" width="210" height="130" rx="14"/><text class="text label" x="310" y="224">Storage</text><text class="text small muted" x="310" y="252">Postgres</text><text class="text small muted" x="310" y="274">object store</text><text class="text small muted" x="310" y="296">search / index</text>
<rect class="p2" x="580" y="190" width="210" height="130" rx="14"/><text class="text label" x="600" y="224">Sandbox</text><text class="text small muted" x="600" y="252">create / attach</text><text class="text small muted" x="600" y="274">sleep / wake</text><text class="text small muted" x="600" y="296">artifact restore</text>
<rect class="risk" x="870" y="190" width="210" height="130" rx="14"/><text class="text label" x="890" y="224">TokenRouter</text><text class="text small muted" x="890" y="252">JWT / quota</text><text class="text small muted" x="890" y="274">vault exchange</text><text class="text small muted" x="890" y="296">decision log</text>
<rect class="p2" x="0" y="380" width="210" height="94" rx="14"/><text class="text label" x="20" y="414">CometAPI</text><text class="text small muted" x="20" y="442">long media analyze</text>
<rect class="p2" x="290" y="380" width="210" height="94" rx="14"/><text class="text label" x="310" y="414">Memory</text><text class="text small muted" x="310" y="442">brand facts / prefs</text>
<rect class="p2" x="580" y="380" width="210" height="94" rx="14"/><text class="text label" x="600" y="414">Marketplace</text><text class="text small muted" x="600" y="442">skills / recipes</text>
<rect class="risk" x="870" y="380" width="210" height="94" rx="14"/><text class="text label" x="890" y="414">操作记录账本</text><text class="text small muted" x="890" y="442">provenance / evidence</text>
<path class="arrow" d="M975 132 V180"/><path class="arrow" d="M975 322 V370"/><path class="arrow" d="M105 180 V142"/><path class="arrow" d="M395 180 V142"/><path class="arrow" d="M685 180 V142"/>
</g>
