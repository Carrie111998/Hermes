<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="数据面建设图">
<style>
.bg{fill:#fffdf8}.box{fill:#fff7e8;stroke:#d9cfbd;stroke-width:2}.p0{fill:#edf8fa;stroke:#80b9c4;stroke-width:2}.p1{fill:#f1fbf3;stroke:#8ebd98;stroke-width:2}.p2{fill:#f6f0ff;stroke:#bba4d9;stroke-width:2}.risk{fill:#fff0ee;stroke:#d99a94;stroke-width:2}.external{fill:#edf5fb;stroke:#83b2d1;stroke-width:2}.text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#1d1e1a}.muted{fill:#66635d}.title{font-size:24px;font-weight:750}.label{font-size:15px;font-weight:750}.small{font-size:12px}.tiny{font-size:11px}.arrow{stroke:#7a746a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.line{stroke:#d9cfbd;stroke-width:2;fill:none}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7a746a"/></marker></defs>
<rect class="bg" width="1280" height="540" rx="20"/><text class="text title" x="36" y="46">数据面：资产、任务、文件和来源链路</text><text class="text small muted" x="36" y="72">生成结果不是消息里的 URL，而是可搜索、可复用、可检查的资产。</text>
<g transform="translate(54,118)">
<rect class="p0" x="0" y="0" width="190" height="110" rx="14"/><text class="text label" x="20" y="36">Upload</text><text class="text small muted" x="20" y="66">media_input</text><text class="text small muted" x="20" y="88">metadata</text>
<path class="arrow" d="M200 55 H250"/>
<rect class="p0" x="260" y="0" width="190" height="110" rx="14"/><text class="text label" x="280" y="36">MediaJob</text><text class="text small muted" x="280" y="66">image / video</text><text class="text small muted" x="280" y="88">status / error</text>
<path class="arrow" d="M460 55 H510"/>
<rect class="p1" x="520" y="0" width="190" height="110" rx="14"/><text class="text label" x="540" y="36">Asset Service</text><text class="text small muted" x="540" y="66">asset refs</text><text class="text small muted" x="540" y="88">权限 / 来源链路</text>
<path class="arrow" d="M720 55 H770"/>
<rect class="box" x="780" y="0" width="190" height="110" rx="14"/><text class="text label" x="800" y="36">Asset Library UI</text><text class="text small muted" x="800" y="66">gallery / picker</text><text class="text small muted" x="800" y="88">reuse / download</text>
<rect class="box" x="1040" y="0" width="160" height="110" rx="14"/><text class="text label" x="1060" y="36">Inspector</text><text class="text small muted" x="1060" y="66">QA / actions</text>
<rect class="p1" x="0" y="182" width="190" height="110" rx="14"/><text class="text label" x="20" y="218">Collections</text><text class="text small muted" x="20" y="248">manual list</text>
<rect class="p1" x="260" y="182" width="190" height="110" rx="14"/><text class="text label" x="280" y="218">Smart Groups</text><text class="text small muted" x="280" y="248">saved query</text>
<rect class="p1" x="520" y="182" width="190" height="110" rx="14"/><text class="text label" x="540" y="218">Character / Element</text><text class="text small muted" x="540" y="248">control refs</text>
<rect class="p2" x="780" y="182" width="190" height="110" rx="14"/><text class="text label" x="800" y="218">CometAPI</text><text class="text small muted" x="800" y="248">long media chunks</text>
<rect class="p0" x="1040" y="182" width="160" height="110" rx="14"/><text class="text label" x="1060" y="218">Storage</text><text class="text small muted" x="1060" y="248">DB / object</text><text class="text small muted" x="1060" y="270">search index</text>
<path class="arrow" d="M970 55 H1030"/><path class="arrow" d="M615 112 V174"/><path class="arrow" d="M875 112 V174"/><path class="arrow" d="M1120 112 V174"/>
</g>
</svg>
