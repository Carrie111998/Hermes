<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="控制面建设图">
<style>
.bg{fill:#fffdf8}.box{fill:#fff7e8;stroke:#d9cfbd;stroke-width:2}.p0{fill:#edf8fa;stroke:#80b9c4;stroke-width:2}.p1{fill:#f1fbf3;stroke:#8ebd98;stroke-width:2}.p2{fill:#f6f0ff;stroke:#bba4d9;stroke-width:2}.risk{fill:#fff0ee;stroke:#d99a94;stroke-width:2}.external{fill:#edf5fb;stroke:#83b2d1;stroke-width:2}.text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#1d1e1a}.muted{fill:#66635d}.title{font-size:24px;font-weight:750}.label{font-size:15px;font-weight:750}.small{font-size:12px}.tiny{font-size:11px}.arrow{stroke:#7a746a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.line{stroke:#d9cfbd;stroke-width:2;fill:none}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7a746a"/></marker></defs>
<rect class="bg" width="1280" height="520" rx="20"/><text class="text title" x="36" y="46">控制面：谁能做什么，用什么额度</text><text class="text small muted" x="36" y="72">控制面不理解 prompt，它只做身份、策略、额度、审批、凭证和操作记录。</text>
<g transform="translate(52,124)">
<rect class="p0" x="0" y="0" width="170" height="100" rx="14"/><text class="text label" x="20" y="34">Browser</text><text class="text small muted" x="20" y="62">session token</text>
<path class="arrow" d="M180 50 H228"/>
<rect class="p0" x="238" y="0" width="170" height="100" rx="14"/><text class="text label" x="258" y="34">Edge Gateway</text><text class="text small muted" x="258" y="62">TLS / routes</text>
<path class="arrow" d="M418 50 H466"/>
<rect class="p1" x="476" y="0" width="170" height="100" rx="14"/><text class="text label" x="496" y="34">Identity</text><text class="text small muted" x="496" y="62">OIDC / tenant</text>
<path class="arrow" d="M656 50 H704"/>
<rect class="p2" x="714" y="0" width="170" height="100" rx="14"/><text class="text label" x="734" y="34">OPA Policy</text><text class="text small muted" x="734" y="62">default deny</text>
<path class="arrow" d="M894 50 H942"/>
<rect class="p0" x="952" y="0" width="200" height="100" rx="14"/><text class="text label" x="972" y="34">Session API</text><text class="text small muted" x="972" y="62">prompt / events</text>
<rect class="risk" x="238" y="178" width="200" height="120" rx="14"/><text class="text label" x="258" y="214">TokenRouter</text><text class="text small muted" x="258" y="244">HF_JWT_TOKEN</text><text class="text small muted" x="258" y="266">quota / allowlist</text>
<rect class="risk" x="514" y="178" width="200" height="120" rx="14"/><text class="text label" x="534" y="214">Vault</text><text class="text small muted" x="534" y="244">provider keys</text><text class="text small muted" x="534" y="266">never in sandbox</text>
<rect class="p1" x="790" y="178" width="200" height="120" rx="14"/><text class="text label" x="810" y="214">Approval</text><text class="text small muted" x="810" y="244">budget / publish</text><text class="text small muted" x="810" y="266">delete / private URL</text>
<rect class="risk" x="514" y="342" width="200" height="92" rx="14"/><text class="text label" x="534" y="378">操作记录账本</text><text class="text small muted" x="534" y="406">decision_id / usage</text>
<path class="arrow" d="M1052 105 C1052 156 342 134 342 170"/><path class="arrow" d="M448 238 H504"/><path class="arrow" d="M614 300 V334"/><path class="arrow" d="M790 238 H724"/>
</g>
</svg>
