# Profil Web Design — WMH Project
# Persona : SOUL.md (design & intégration web, fidélité maquette, mobile-first).
# Aucun connecteur MCP requis. Amorcé sur le volume par docker/entrypoint.sh.

# Claude Opus 5 en direct sur l'API Anthropic (ANTHROPIC_API_KEY, var Railway)
# pour le jugement esthétique/vision — remplace Gemini 3.1 Pro via OpenRouter
# (2026-07-26).
model:
  default: "claude-opus-5"
  provider: "anthropic"

# Bascule automatique mi-session si l'API Anthropic directe sature
# (overloaded_error, cf. incident 2026-07-26) : même Opus 5 via OpenRouter.
fallback_providers:
  - provider: openrouter
    model: "anthropic/claude-opus-5"

terminal:
  backend: local

# Coordination multi-agents. La porte Kanban lit ce toolset top-level
# (tools/kanban_tools.py: _profile_has_kanban_toolset). Permet à ce profil de
# créer/assigner des tâches et d'agir comme worker sur le board partagé
# (<root>/kanban.db, commun aux profils).
toolsets:
  - kanban

# API Magnific (upscale/enhance d'images) — consommée en curl par le skill
# `magnific` (skills/magnific/SKILL.md, rafraîchi à chaque redeploy Railway).
# Vars Railway attendues (globales au conteneur, injectées dans l'env) :
#   MAGNIFIC_API_KEY        — clé API (header x-magnific-api-key)
#   MAGNIFIC_WEBHOOK_SECRET — signing secret pour vérifier les payloads webhook.
#                             Inutilisé tant qu'aucun récepteur HTTP n'est exposé :
#                             le skill récupère les résultats en pollant le task_id.

# Autonomie non-supervisée : assesseur LLM pour auto-approuver/refuser les
# commandes dangereuses au lieu de bloquer en attente d'une validation humaine
# (défaut approvals.mode=manual, cf. #30882). provider "auto" => OpenRouter.
auxiliary:
  approval:
    provider: "auto"
    model: ""

# Skills désactivées (2026-08-05) : bundles Nous hors-scope (ML/fine-tuning,
# jeux, art génératif, intégrations inutilisées). Liste identique sur les 5
