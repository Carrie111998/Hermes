# Hermes Agent — Railway Configuration
# Pre-configured for Discord gateway with direct Anthropic API.
# Environment variables (ANTHROPIC_API_KEY, DISCORD_BOT_TOKEN) are
# injected by Railway and loaded from the container's .env file.

model:
  # Orchestrateur (profil défaut) : GLM 5.2 — suit mieux les consignes de routage
  # que Qwen 3.6 (qui faisait le travail lui-même au lieu de créer une carte Kanban).
  default: "z-ai/glm-5.2"
  provider: "openrouter"

gateway:
  platforms:
    - discord
    - whatsapp   # ACTIF (2026-07-02) — compte DÉDIÉ 33685686316, mode bot.
                 # Pour re-pauser : recommenter ceci ET le bloc `whatsapp:` plus bas.

terminal:
  backend: local

# WhatsApp (groupes) — ACTIF (2026-07-02). Compte DÉDIÉ 33685686316 en mode bot.
# ⚠️ La présence de ce bloc (avec `extra`) participe à l'activation via la porte
# d'auto-activation de gateway/config.py (is_connected → True). Pour PAUSER WhatsApp,
# il faut recommenter TOUT ce bloc ET retirer `- whatsapp` de gateway.platforms.
# Poste fermé par défaut : group_policy=allowlist SANS JID => aucun groupe traité tant
# que group_allow_from n'est pas rempli (sécurité). L'allowlist DM vient de la var
# Railway WHATSAPP_ALLOWED_USERS (=33609152093, le perso de Gilles, pour piloter en DM).
whatsapp:
  group_policy: "allowlist"
  group_allow_from:
    - "120363426647005883@g.us"      # Test Pippa
  require_mention: true
  mention_patterns:
    - "@bot"
    - "@hermes"
    - "@pippa"                        # le bot s'appelle Pippa
  free_response_chats:               # groupes où TOUT message = une demande (sans @mention)
    - "120363426647005883@g.us"      # Test Pippa (groupe de test → réponse à tout message)
  dm_policy: "allowlist"             # allow_from fourni par WHATSAPP_ALLOWED_USERS (var Railway)

compression:
  enabled: true

# Kanban multi-agent coordination. This (default) profile runs the foreground
# gateway on Railway, so it hosts the dispatcher that claims tasks and spawns
# workers (`hermes -p <assignee> chat -q "work kanban task <id>"`) into the
# web-design / web-dev profiles. The board is shared at <root>/kanban.db across
# all profiles (see hermes_cli/kanban_db.py: kanban_home).
kanban:
  dispatch_in_gateway: true

# Enables the Kanban orchestrator tool surface (kanban_create/list/unblock) so
# this profile can create and assign cross-profile tasks. Le gate lit cette liste
# top-level (tools/kanban_tools.py: _profile_has_kanban_toolset).
toolsets:
  - kanban

# Outils PAR PLATEFORME. Le profil défaut est l'ORCHESTRATEUR : sur WhatsApp il doit
# UNIQUEMENT trier et router (kanban_create), jamais coder/déployer. On restreint donc
# whatsapp à un set minimal (kanban + planning + rappel) — SANS terminal/file/web/browser,
# qui poussaient qwen à faire le travail lui-même au lieu de créer une carte. Sa réponse
# texte part quand même dans le groupe (auto, pas besoin d'outil). Les autres plateformes
# gardent leurs presets complets (Discord/chat non impactés).
platform_toolsets:
  cli: [hermes-cli]
  discord: [hermes-discord]
  # Pas de `todo` : GLM s'en servait comme planning en mémoire au lieu de créer une
  # carte. Son SEUL moyen d'action = kanban. session_search reste pour rappeler le
  # contexte (repo/projet d'une conversation passée).
  whatsapp: [kanban, session_search]
