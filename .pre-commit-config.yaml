# Secret-scanning pre-commit for the agent-src repo.
# Mirrors the ~/.hermes gitleaks wiring (SR-001) and the jobflow-dashboard repo:
# same pinned rev and the same shared laptop ruleset, so allowlists stay in one
# place. Install the hook with `pre-commit install` after cloning (the generated
# .git/hooks/pre-commit is not tracked; this file is). gitleaks 8.30 uses `git`,
# not the deprecated `protect`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args:
          - --config=C:/Users/diego/.config/gitleaks/gitleaks.toml

  # ruff lint gate (Pyflakes "F" group + PLW1514).
  #
  # The rule set lives in ruff.toml at the repo root -- NOT pyproject.toml --
  # so this hook and the blocking CI job (.github/workflows/lint.yml, which
  # runs a bare `ruff check .`) stay in sync automatically. Adding a rule
  # there arms it in both places at once.
  #
  # This restores enforcement that landed in May 2026 and fell out of main in
  # the v0.15.1 cutover. The F group is enforced tree-wide with NO
  # suppressions -- the re-land sunset list was burned to zero and deleted
  # (2026-08-17). ruff.toml's per-file-ignores now holds only PLW1514
  # exemptions for tests/, skills/, optional-skills/ and plugins/.
  #
  # Deliberately NO --fix: a pre-commit hook that rewrites source during a
  # commit hides the change from the diff the author is reviewing, and the
  # F841 autofix in particular can delete side-effecting statements.
  #
  # The RULES stay in sync via ruff.toml. The ruff BINARY version is declared
  # in FOUR files, all on 0.15.12 as of 2026-08-17:
  #   1. this hook's `rev:` below (pre-commit's own isolated env)
  #   2. both lint.yml jobs -- `uv tool install ruff==0.15.12`
  #   3. ruff.toml `required-version`
  #   4. pyproject.toml's dev extra, which is what the repo .venv installs
  # tests/test_lint_config.py::TestRuffVersionPins asserts all four agree, so
  # bumping any one alone fails the suite -- and an UNPINNED `uv tool install
  # ruff` fails it too rather than passing unnoticed.
  #
  # (3) is the one that reaches the binaries no test can see: ruff refuses to
  # load this config under a version it does not match and exits 2 (verified
  # 2026-08-17 -- 0.15.10 and 0.16.3 both fail with "Required version
  # `==0.15.12` does not match"). That covers whatever ruff is on PATH, which
  # is what events/producers/ruff_gate_probe.py shells out to every 15 minutes;
  # before it, the alarm's version depended on whether a session happened to
  # have the .venv activated. The probe reads exit >= 2 as UNMEASURABLE rather
  # than clean, so a mismatch there surfaces as a broken alarm instead of a
  # silent pass. A bump is a four-file change or it is a drift.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12 # the ruff pre-commit runs -- see the version note above
    hooks:
      - id: ruff-check
        name: ruff (Pyflakes F group + PLW1514)

  # EventType / sibling-lookup-table drift guard.
  #
  # Adding a member to events/schema.py EventType requires a paired entry in
  # every table contracted to be total over the enum (EVENT_TYPE_EMOJI,
  # routing_policy._POLICY). That pairing has broken four times on record
  # (2026-04-27 x2, 2026-05-29, 2026-08-11) and ruff structurally cannot catch
  # it -- the keys are attribute accesses, which F601/F602 do not reach.
  #
  # This runs at ADD time, which the coverage tests do not: they only fail on a
  # later `pytest tests/events/` that nobody ran at the four recurrences. It is
  # a read-only import + dict comparison, no I/O, well under a second warm.
  # See events/coverage.py for what it checks and why an import-time assertion
  # in the gateway would be the wrong trade.
  #
  # This hook is still bypassable (`--no-verify`, or a checkout where pre-commit
  # was never installed), so it is backstopped -- not replaced -- by a non-fatal
  # runtime signal: each required-total table calls
  # events.coverage.log_missing_members() at the bottom of its own module and a
  # running gateway logs ONE error naming every member with no entry.
  - repo: local
    hooks:
      - id: event-type-coverage
        name: EventType lookup-table coverage
        entry: python -m events.coverage
        language: system
        pass_filenames: false
        files: ^events/.*\.py$
