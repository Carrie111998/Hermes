repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv tool run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ty
        name: ty (type check)
        entry: uv tool run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: trailing-whitespace
        name: trailing whitespace
        entry: uv tool run ruff format --diff --stdin-filename {filename}
        language: system
        types: [text]
        pass_filenames: true

      - id: end-of-file-fixer
        name: end of file fixer
        entry: uv tool run ruff format --diff --stdin-filename {filename}
        language: system
        types: [text]
        pass_filenames: true
