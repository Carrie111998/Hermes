[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.13.0"
description = "The self-improving AI agent — creates skills from experience, improves them during use, and runs anywhere"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nous Research" },
]
dependencies = [
    "openai==2.24.0",
    "python-dotenv==1.2.1",
    "fire==0.7.1",
    "httpx[socks]==0.28.1",
    "rich==14.3.3",
    "tenacity==9.1.4",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.18.17",
    "requests==2.33.0",
    "jinja2==3.1.6",
    "pydantic==2.12.5",
    "prompt_toolkit==3.0.52",
    "croniter==6.0.0",
    "PyJWT[crypto]==2.12.1",
    "tzdata==2025.3; sys_platform == 'win32'",
    "psutil==7.2.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "agent",
    "ai",
    "llm",
    "cli",
    "automation",
    "tools",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
anthropic = [
    "anthropic==0.86.0",
]
exa = [
    "exa-py==2.10.2",
]
firecrawl = [
    "firecrawl-py==4.17.0",
]
parallel-web = [
    "parallel-web==0.4.2",
]
fal = [
    "fal-client==0.13.1",
]
edge-tts = [
    "edge-tts==7.2.7",
]
modal = [
    "modal==1.3.4",
]
daytona = [
    "daytona==0.155.0",
]
vercel = [
    "vercel==0.5.7",
]
hindsight = [
    "hindsight-client==0.6.1",
]
dev = [
    "debugpy==1.8.20",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-xdist==3.8.0",
    "pytest-split==0.11.0",
    "mcp==1.26.0",
    "ty==0.0.21",
    "ruff==0.15.10",
]
messaging = [
    "python-telegram-bot[webhooks]==22.6",
    "discord.py[voice]==2.7.1",
    "aiohttp==3.13.3",
    "brotlicffi==1.2.0.1",
    "slack-bolt==1.27.0",
    "slack-sdk==3.40.1",
    "qrcode==7.4.2",
]
cron = []
slack = [
    "slack-bolt==1.27.0",
    "slack-sdk==3.40.1",
    "aiohttp==3.13.3",
]
matrix = [
    "mautrix[encryption]==0.21.0",
    "Markdown==3.10.2",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "aiohttp-socks==0.11.0",
]
cli = [
    "simple-term-menu==1.6.6",
]
tts-premium = [
    "elevenlabs==1.59.0",
]
voice = [
    "faster-whisper==1.2.1",
    "sounddevice==0.5.5",
    "numpy==2.4.3",
]
pty = [
    "ptyprocess==0.7.0; sys_platform != 'win32'",
    "pywinpty==2.0.15; sys_platform == 'win32'",
]
honcho = [
    "honcho-ai==2.0.1",
]
mcp = [
    "mcp==1.26.0",
]
homeassistant = [
    "aiohttp==3.13.3",
]
sms = [
    "aiohttp==3.13.3",
]
computer-use = [
    "mcp==1.26.0",
]
acp = [
    "agent-client-protocol==0.9.0",
]
bedrock = [
    "boto3==1.42.89",
]
termux = [
    "python-telegram-bot[webhooks]==22.6",
    "hermes-agent[cron]",
    "hermes-agent[cli]",
    "hermes-agent[pty]",
    "hermes-agent[mcp]",
    "hermes-agent[honcho]",
    "hermes-agent[acp]",
]
termux-all = [
    "hermes-agent[termux]",
    "hermes-agent[google]",
    "hermes-agent[homeassistant]",
    "hermes-agent[sms]",
    "hermes-agent[web]",
]
dingtalk = [
    "dingtalk-stream==0.24.3",
    "alibabacloud-dingtalk==2.2.42",
    "qrcode==7.4.2",
]
feishu = [
    "lark-oapi==1.5.3",
    "qrcode==7.4.2",
]
google = [
    "google-api-python-client==2.194.0",
    "google-auth-oauthlib==1.3.1",
    "google-auth-httplib2==0.3.1",
]
youtube = [
    "youtube-transcript-api==1.2.4",
]
web = [
    "fastapi==0.133.1",
    "uvicorn[standard]==0.41.0",
]
all = [
    "hermes-agent[cron]",
    "hermes-agent[cli]",
    "hermes-agent[dev]",
    "hermes-agent[pty]",
    "hermes-agent[mcp]",
    "hermes-agent[homeassistant]",
    "hermes-agent[sms]",
    "hermes-agent[acp]",
    "hermes-agent[google]",
    "hermes-agent[web]",
    "hermes-agent[youtube]",
]

[project.scripts]
hermes = "hermes_cli.main:main"
hermes-agent = "run_agent:main"
hermes-acp = "acp_adapter.entry:main"

[project.urls]
Homepage = "https://github.com/Tehen1/hermes-agent"
Repository = "https://github.com/Tehen1/hermes-agent"
Issues = "https://github.com/Tehen1/hermes-agent/issues"
Documentation = "https://hermes-agent.nousresearch.com/docs/"

[tool.setuptools]
py-modules = [
    "run_agent",
    "model_tools",
    "toolsets",
    "batch_runner",
    "trajectory_compressor",
    "toolset_distributions",
    "cli",
    "hermes_bootstrap",
    "hermes_constants",
    "hermes_state",
    "hermes_time",
    "hermes_logging",
    "utils",
]

[tool.setuptools.package-data]
hermes_cli = [
    "web_dist/**/*",
    "tui_dist/**/*",
    "scripts/install.sh",
]
gateway = [
    "assets/**/*",
]
acp_adapter = [
    "bootstrap/*.sh",
    "bootstrap/*.ps1",
]

[tool.setuptools.packages.find]
include = [
    "agent",
    "agent.*",
    "tools",
    "tools.*",
    "hermes_cli",
    "gateway",
    "gateway.*",
    "tui_gateway",
    "tui_gateway.*",
    "cron",
    "acp_adapter",
    "acp_adapter.*",
    "plugins",
    "plugins.*",
    "providers",
    "providers.*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "PLW1514",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLW1514",
]
"skills/**" = [
    "PLW1514",
]
"optional-skills/**" = [
    "PLW1514",
]
"plugins/**" = [
    "PLW1514",
]
