# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: atlassian
description: >-
  Official Atlassian remote MCP — search, summarize, create, and update
  Jira, Jira Service Management, Confluence, and Bitbucket content.
source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/

# Atlassian ships a remote MCP server with native OAuth 2.1 over Streamable
# HTTP. Hermes's MCP client + mcp_oauth_manager handle discovery, PKCE,
# token exchange, and refresh — nothing to install locally.
transport:
  type: http
  url: https://mcp.atlassian.com/v1/mcp/authv2

auth:
  type: oauth
  # No `provider:` — this is native MCP OAuth (case 1), not a third-party
  # provider like Google. The MCP client triggers the browser flow on the
  # first probe / first connect. Actions taken through the server respect
  # the authenticated user's existing Atlassian permissions.

# Tool selection at install time:
# The server spans four products (Jira, JSM, Confluence, Bitbucket) with a
# mix of read (search/summarize) and write (create/update) tools. We leave
# `default_enabled` unset so the install-time checklist starts with
# everything pre-checked — users prune what they don't want.

post_install: |
  On first connection, Hermes will open a browser to authenticate with
  Atlassian. After auth, restart your Hermes session so the Jira,
  Confluence, and Bitbucket tools are loaded.

  You can re-run the tool checklist any time with:
    hermes mcp configure atlassian
