# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: supabase
description: >-
  Database, auth, and storage from your Supabase projects.
source: https://supabase.com/docs/guides/ai-tools/mcp

# Official vendor-hosted remote MCP (URL-only — Orion never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration;
# Orion's MCP client + mcp_oauth_manager handle discovery, PKCE, token
# exchange, and refresh.
transport:
  type: http
  url: https://mcp.supabase.com/mcp

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - supabase
  hosts:
    - supabase.com
    - supabase.co

post_install: |
  On first connection Orion opens a browser to authorize with
  Supabase (or run `orion mcp login supabase`). Approve access,
  then restart the session so tools load.
