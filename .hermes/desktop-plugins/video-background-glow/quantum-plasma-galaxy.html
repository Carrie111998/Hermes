    html, body {

    }

    

    canvas {

      display: block;

      width: 100%;

      height: 100%;

    }

    

    /* Control Panel Styles */

    .controls-panel {

      position: fixed;

      top: 20px;

      left: 20px;

      background: rgba(0, 0, 0, 0.7);

      border: 1px solid rgba(0, 255, 255, 0.3);

      border-radius: 12px;

      padding: 16px;

      color: #00ffff;

      font-family: 'Courier New', monospace;

      font-size: 14px;

      z-index: 1000;

      pointer-events: auto;

    }

    

    .controls-panel h2 {

      margin: 0 0 12px 0;

      font-size: 18px;

      text-align: center;

      color: #00ffff;

      text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);

    }

    

    .control-group {

      margin-bottom: 12px;

    }

    

    .control-label {

      display: block;

      margin-bottom: 4px;

      font-size: 12px;

      color: #88ffff;

    }

    

    .control-input {

      width: 100%;

      padding: 6px;

      background: rgba(0, 0, 0, 0.5);

      border: 1px solid rgba(0, 255, 255, 0.2);

      border-radius: 6px;

      color: #00ffff;

      font-family: 'Courier New', monospace;

      font-size: 13px;

    }

    

    .control-input:focus {

      outline: none;

      border-color: #00ffff;

      box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);

    }

    

    .toggle-switch {

      display: flex;

      align-items: center;

      cursor: pointer;

      user-select: none;

    }

    

    .toggle-switch input {

      display: none;

    }

    

    .toggle-slider {

      width: 40px;

      height: 20px;

      background: #333;

      border-radius: 10px;

      position: relative;

      margin-right: 8px;

      transition: background 0.3s;

    }

    

    .toggle-slider:before {

      content: '';

      position: absolute;

      width: 16px;

      height: 16px;

      background: #00ffff;

      border-radius: 50%;

      top: 2px;

      left: 2px;

      transition: transform 0.3s;

    }

    

    .toggle-switch input:checked + .toggle-slider {

      background: #0080ff;

    }

    

    .toggle-switch input:checked + .toggle-slider:before {

      transform: translateX(20px);

    }

    

    .toggle-label {

      font-size: 12px;

      color: #88ffff;

    }

    

    /* Performance Display */

    .fps-display {

      position: fixed;

      top: 20px;

      right: 20px;

      background: rgba(0, 0, 0, 0.7);

      border: 1px solid rgba(0, 255, 255, 0.3);

      border-radius: 12px;

      padding: 12px 16px;

      color: #00ffff;

      font-family: 'Courier New', monospace;

      font-size: 14px;

      z-index: 1000;

      pointer-events: none;

    }

    

    .fps-value {

      font-size: 18px;

      font-weight: bold;

      color: #00ff00;

      text-shadow: 0 0 8px rgba(0, 255, 0, 0.5);

    }

    

    /* Help System */

    .help-tooltip {

      position: fixed;

      background: rgba(0, 0, 0, 0.8);

      border: 1px solid rgba(0, 255, 255, 0.4);

      border-radius: 8px;

      padding: 12px;

      color: #ffffcc;

      font-size: 13px;

      font-family: 'Courier New', monospace;

      z-index: 2000;

      pointer-events: none;

      max-width: 280px;

      opacity: 0;

      transition: opacity 0.3s;

    }

    

    .help-tooltip.visible {

      opacity: 1;

    }

    

    /* Loading Screen */

    .loading-screen {

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background: linear-gradient(135deg, #000000, #0a0a0a);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      z-index: 3000;

    }

    

    .loading-logo {

      font-size: 48px;

      font-weight: bold;

      background: linear-gradient(to right, #00ffff, #ff00ff, #ffff00);

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      margin-bottom: 24px;

      text-shadow: 0 0 16px rgba(0, 255, 255, 0.5);

    }

    

    .loading-text {

      color: #88ffff;

      font-size: 18px;

      margin-bottom: 32px;

      letter-spacing: 2px;

    }

    

    .loading-bar {

      width: 300px;

      height: 8px;

      background: rgba(0, 0, 0, 0.5);

      border-radius: 4px;

      overflow: hidden;

    }

    

    .loading-progress {

      height: 100%;

      width: 0%;

      background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);

      transition: width 0.3s ease;

      box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);

    }

    

    /* Node Styles */

    .node-label {

      position: absolute;

      color: #ffffff;

      font-family: 'Courier New', monospace;

      font-size: 11px;

      pointer-events: none;

      text-shadow: 0 0 4px rgba(0,0,0,0.8);

      transform: translate(-50%, -50%);

      white-space: nowrap;

      opacity: 0;

      transition: opacity 0.3s;

    }

    

    .node-label.visible {

      opacity: 0.8;

    }

    

    /* Connection Lines */

    .connection-line {

      position: absolute;

      pointer-events: none;

      z-index: 5;

    }

  </style>

    class QuantumGalaxy {

      constructor() {

        this.canvas = document.createElement('canvas');

        this.ctx = this.canvas.getContext('2d');

        document.body.appendChild(this.canvas);

        

        this.resize();

        window.addEventListener('resize', () => this.resize());

        

        // Initialize systems

        this.plasmaEngine = new PlasmaEngine();

        this.liquidEngine = new LiquidEngine();

        this.vortexEngine = new VortexEngine();

        this.helpSystem = new HelpSystem();

        this.performanceMonitor = new PerformanceMonitor();

        

        // Load vault data

        this.vaultData = null;

        this.nodes = [];

        this.connections = [];

        this.labels = [];

        

        // State

        this.isPaused = false;

        this.helpVisible = false;

        this.performanceLocked = true;

        this.targetFPS = 60;

        this.lastTime = 0;

        this.frameCount = 0;

        this.fps = 0;

        

        // Interaction

        this.mouse = { x: 0, y: 0, down: false };

        this.initMouseEvents();

        

        // Initialize

        this.init();

      }

      

      resize() {

        this.canvas.width = window.innerWidth;

        this.canvas.height = window.innerHeight;

        this.width = this.canvas.width;

        this.height = this.canvas.height;

      }

      

      async init() {

        // Show loading

        const loadingScreen = document.getElementById('loading-screen');

        const progressBar = document.getElementById('loading-progress');

        

        // Load vault data

        this.updateLoading("Loading vault data...", 20);

        await this.loadVaultData();

        

        // Initialize engines

        this.updateLoading("Initializing plasma core...", 40);

        this.plasmaEngine.init(this);

        

        this.updateLoading("Setting up liquid dynamics...", 60);

        this.liquidEngine.init(this);

        

        this.updateLoading("Calculating vortex fields...", 80);

        this.vortexEngine.init(this);

        

        // Create visual elements

        this.updateLoading("Generating particle field...", 90);

        this.createVisualElements();

        

        // Start animation loop

        this.updateLoading("Achieving quantum coherence...", 95);

        setTimeout(() => {

          loadingScreen.style.opacity = '0';

          setTimeout(() => {

            loadingScreen.style.display = 'none';

            this.lastTime = performance.now();

            requestAnimationFrame(this.animate.bind(this));

          }, 500);

        }, 1000);

      }

      

      updateLoading(text, percent) {

        document.querySelector('.loading-text').textContent = text;

        document.getElementById('loading-progress').style.width = percent + '%';

      }

        this.canvas.addEventListener('mousedown', (e) => {

        });

        

        this.canvas.addEventListener('mousemove', (e) => {

          this.mouse.x = e.clientX;

          this.mouse.y = e.clientY;

          

          // Update help tooltip position

          if (this.helpVisible) {

            this.helpSystem.updateTooltip(e.clientX, e.clientY);

          }

        });

        

        this.canvas.addEventListener('mouseup', () => {

          this.mouse.down = false;

        });

        

        this.canvas.addEventListener('mouseleave', () => {

          this.mouse.down = false;

        });

      }

      

      animate(currentTime) {

        // Calculate delta time

        const deltaTime = (currentTime - this.lastTime) / 1000; // in seconds

        this.lastTime = currentTime;

        

        // FPS calculation

        this.frameCount++;

        if (currentTime - this.lastTime >= 1000) {

          this.fps = Math.round(this.frameCount * 1000 / (currentTime - this.lastTime));

          this.frameCount = 0;

          this.lastTime = currentTime;

          document.getElementById('fps-value').textContent = this.fps;

        }

        

        // Performance lock - cap at target FPS

        if (this.performanceLocked && this.fps > this.targetFPS) {

          // Sleep to cap FPS

          const sleepTime = 1000 / this.targetFPS - deltaTime * 1000;

          if (sleepTime > 0) {

            setTimeout(() => requestAnimationFrame(this.animate.bind(currentTime)), sleepTime);

            return;

          }

        }

        

        if (!this.isPaused) {

          this.update(deltaTime);

          this.render();

        }

        

        requestAnimationFrame(this.animate.bind(this));

      }

      

      update(deltaTime) {

        // Update engines

        this.plasmaEngine.update(deltaTime, this);

        this.liquidEngine.update(deltaTime, this);

        this.vortexEngine.update(deltaTime, this);

        

        // Update nodes with physics

        this.updateNodes(deltaTime);

        

        // Update particles

        this.updateParticles(deltaTime);

        

        // Update help system

        this.helpSystem.update();

        

        // Update performance monitor

        this.performanceMonitor.update();

      }

      

      updateNodes(deltaTime) {

        const magneticStrength = parseFloat(document.getElementById('magnetic-strength').value);

        const vortexIntensity = parseFloat(document.getElementById('vortex-intensity').value);

        

        this.nodes.forEach(node => {

          // Reset acceleration

          node.ax = 0;

          node.ay = 0;

          

          // Magnetic core attraction (towards center)

          const centerX = this.width / 2;

          const centerY = this.height / 2;

          const dx = centerX - node.x;

          const dy = centerY - node.y;

          const distToCenter = Math.sqrt(dx * dx + dy * dy);

          const centerForce = magneticStrength * 0.0005 * node.mass / (distToCenter + 1);

          

          node.ax += dx * centerForce;

          node.ay += dy * centerForce;

          

          // Vortex effects (spiral motion)

          const vortexForce = vortexIntensity * 0.0002;

          node.ax -= dy * vortexForce * node.mass;

          node.ay += dx * vortexForce * node.mass;

          

          // Connection forces (springs between connected nodes)

          node.connections.forEach(conn => {

            const otherNode = this.nodes.find(n => n.id === conn.otherNodeId);

            if (otherNode) {

              const dx = otherNode.x - node.x;

              const dy = otherNode.y - node.y;

              const dist = Math.sqrt(dx * dx + dy * dy);

              const idealDist = 150; // Ideal distance between connected nodes

              const force = conn.link.strength * 0.0002 * (dist - idealDist);

              

              node.ax += dx * force / node.mass;

              node.ay += dy * force / node.mass;

            }

          });

          

          // Repulsion from other nodes (to prevent clumping)

          this.nodes.forEach(other => {

            if (other.id !== node.id) {

              const dx = otherNode.x - node.x;

              const dy = otherNode.y - node.y;

              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 50 && dist > 0) {

                const force = 0.0001 / (dist * dist);

                node.ax -= dx * force / node.mass;

                node.ay -= dy * force / node.mass;

              }

            }

          });

          

          // Apply velocity damping

          node.vx *= 0.995;

          node.vy *= 0.995;

          

          // Apply acceleration

          node.vx += node.ax * deltaTime;

          node.vy += node.ay * deltaTime;

          

          // Apply velocity

          node.x += node.vx * deltaTime;

          node.y += node.vy * deltaTime;

          

          // Boundary conditions (wrap around)

          if (node.x < 0) node.x = this.width;

          if (node.x > this.width) node.x = 0;

          if (node.y < 0) node.y = this.height;

          if (node.y > this.height) node.y = 0;

          

          // Update pulse for glow effect

          node.pulse += node.pulseSpeed * deltaTime;

        });

      }

      

      updateParticles(deltaTime) {

        // Clear with gradient background

        const gradient = this.ctx.createRadialGradient(

          this.width / 2, this.height / 2, 0,

          this.width / 2, this.height / 2, Math.max(this.width, this.height)

        );

        gradient.addColorStop(0, '#000000');

        gradient.addColorStop(0.3, '#0a0a0a');

        gradient.addColorStop(0.6, '#050508');

        gradient.addColorStop(1, '#000000');

        

        this.ctx.fillStyle = gradient;

        this.ctx.fillRect(0, 0, this.width, this.height);

        

        // Render connections

        this.renderConnections();

        

        // Render particles (plasma/liquid effects)

        this.renderParticles();

        

        // Render nodes

        this.renderNodes();

        

        // Render labels (if needed)

        this.renderLabels();

      }

      

      renderConnections() {

        this.connectionsContainer.innerHTML = '';

        

        this.connections.forEach(conn => {

          const sourceNode = this.nodes.find(n => n.id === conn.sourceId);

          const targetNode = this.nodes.find(n => n.id === conn.targetId);

          

          if (sourceNode && targetNode) {

            const line = document.createElement('div');

            line.className = 'connection-line';

            

            // Calculate line properties

            const dx = targetNode.x - sourceNode.x;

            const dy = targetNode.y - sourceNode.y;

            const length = Math.sqrt(dx * dx + dy * dy);

            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            

            // Pulsing effect

            conn.pulse += conn.pulseSpeed * 0.016;

            const pulseOffset = Math.sin(conn.pulse) * 0.3;

            const opacity = 0.2 + Math.abs(Math.sin(conn.pulse)) * 0.3;

            

            // Color based on type

            let color = '#00ffff'; // default cyan

            switch(conn.type) {

              case 'wikilink': color = '#00ffff'; break;

              case 'contains': color = '#00ffff'; break;

              case 'uses': color = '#ff00ff'; break;

              case 'related': color = '#ffff00'; break;

              case 'based-on': color = '#88c0d0'; break;

              case 'inspired-by': color = '#b48ead'; break;

              case 'references': color = '#a3be8c'; break;

            }

            

            line.style.position = 'absolute';

            line.style.left = `${sourceNode.x}px`;

            line.style.top = `${sourceNode.y}px`;

            line.style.width = `${length}px`;

            line.style.height = '2px';

            line.style.background = `linear-gradient(to right, ${color}, ${color})`;

            line.style.opacity = opacity.toString();

            line.style.transform = `rotate(${angle}deg)`;

            line.style.transformOrigin = '0 0';

            line.style.boxShadow = `0 0 ${4 + Math.abs(Math.sin(conn.pulse)) * 6}px ${color}`;

            

            this.connectionsContainer.appendChild(line);

          }

        });

      }

      

      renderParticles() {

        this.particles.forEach(p => {

          this.ctx.beginPath();

          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

          

          // Alpha based on life

          const alpha = p.life / p.maxLife;

          this.ctx.fillStyle = `${p.color}${Math.round(alpha * 100).toString(16).padStart(2, '0')}`;

          

          // Add glow

          this.ctx.shadowBlur = p.size * 2;

          this.ctx.shadowColor = p.color;

          

          this.ctx.fill();

          

          // Reset shadow

          this.ctx.shadowBlur = 0;

        });

      }

      

      renderNodes() {

        this.nodes.forEach(node => {

          // Outer glow

          this.ctx.beginPath();

          this.ctx.arc(node.x, node.y, node.size + 4, 0, Math.PI * 2);

          const glowGradient = this.ctx.createRadialGradient(

            node.x, node.y, node.size,

            node.x, node.y, node.size + 8

          );

          glowGradient.addColorStop(0, `rgba(${this.hexToRgb(node.color)}, 0.3)`);

          glowGradient.addColorStop(1, `rgba(${this.hexToRgb(node.color)}, 0)`);

          this.ctx.fillStyle = glowGradient;

          this.ctx.fill();

          

          // Node body

          this.ctx.beginPath();

          this.ctx.arc(node.x, node.y, node.size, 0, Math.PI * 2);

          this.ctx.fillStyle = node.color;

          this.ctx.shadowBlur = node.size * 0.5;

          this.ctx.shadowColor = node.color;

          this.ctx.fill();

          

          // Inner glow/highlight

          this.ctx.beginPath();

          this.ctx.arc(node.x, node.y, node.size * 0.6, 0, Math.PI * 2);

          const highlightGradient = this.ctx.createRadialGradient(

            node.x, node.y, node.size * 0.3,

            node.x, node.y, node.size * 0.6

          );

          highlightGradient.addColorStop(0, 'rgba(255,255,255,0.4)');

          highlightGradient.addColorStop(1, 'rgba(255,255,255,0)');

          this.ctx.fillStyle = highlightGradient;

          this.ctx.fill();

          

          this.ctx.shadowBlur = 0;

        });

      }

      

      renderLabels() {

        // Only show labels on hover - for performance, we'll implement hover detection

        this.nodeLabelsContainer.innerHTML = '';

        

        // For now, show labels for hovered nodes only

        // In a full implementation, we'd check mouse proximity

        this.nodes.forEach(node => {

          // Simple distance check for demo

          const dx = this.mouse.x - node.x;

          const dy = this.mouse.y - node.y;

          const dist = Math.sqrt(dx * dx + dy * dy);

          

          if (dist < 50) { // Show label if mouse is near node

            const label = document.createElement('div');

            label.className = 'node-label';

            label.textContent = node.name;

            label.style.left = `${node.x}px`;

            label.style.top = `${node.y}px`;

            label.style.display = 'block';

            this.nodeLabelsContainer.appendChild(label);

          }

        });

      }

      

      hexToRgb(hex) {

        // Remove # if present

        hex = hex.replace('#', '');

        

        // Parse hex

        const bigint = parseInt(hex, 16);

        const r = (bigint >> 16) & 255;

        const g = (bigint >> 8) & 255;

        const b = bigint & 255;

        

        return `${r},${g},${b}`;

      }

    

    


    }
    // ===== PLASMA ENGINE =====

    class PlasmaEngine {

      init(galaxy) {

        this.galaxy = galaxy;

        this.pinches = [];

        this.createPinches();

      }

      

      createPinches() {

        // Create magnetic pinch points that affect particle flow

        const pinchCount = 3;

        for (let i = 0; i < pinchCount; i++) {

          this.pinches.push({

            x: this.galaxy.width * (0.2 + i * 0.3),

            y: this.galaxy.height * 0.5,

            strength: 0.5 + Math.random() * 1.0,

            rotation: Math.random() * Math.PI * 2,

            rotationSpeed: (Math.random() - 0.5) * 0.02

          });

        }

      }

      

      update(deltaTime, galaxy) {

        // Update pinches

        this.pinches.forEach(pinch => {

          pinch.rotation += pinch.rotationSpeed * deltaTime;

          

          // Apply pinch effect to nearby particles

          galaxy.particles.forEach(p => {

            const dx = pinch.x - p.x;

            const dy = pinch.y - p.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            

            if (dist < 150) {

              const force = pinch.strength * 0.001 * (150 - dist) / 150;

              const angle = Math.atan2(dy, dx) + pinch.rotation;

              p.vx += Math.cos(angle) * force;

              p.vy += Math.sin(angle) * force;

            }

          });

        });

      }

    }

    

    // ===== LIQUID ENGINE =====

    class LiquidEngine {

      init(galaxy) {

        this.galaxy = galaxy;

        this.vortices = [];

        this.createVortices();

      }

      

      createVortices() {

        // Create liquid vortices that create flow patterns

        const vortexCount = 2;

        for (let i = 0; i < vortexCount; i++) {

          this.vortices.push({

            x: this.galaxy.width * (0.3 + i * 0.4),

            y: this.galaxy.height * (0.3 + i * 0.4),

            strength: 0.3 + Math.random() * 0.7,

            rotation: Math.random() * Math.PI * 2,

            rotationSpeed: (Math.random() - 0.5) * 0.01,

            radius: 100 + Math.random() * 150

          });

        }

      }

      

      update(deltaTime, galaxy) {

        // Update vortices

        this.vortices.forEach(vortex => {

          vortex.rotation += vortex.rotationSpeed * deltaTime;

          

          // Apply vortex flow to particles

          galaxy.particles.forEach(p => {

            const dx = p.x - vortex.x;

            const dy = p.y - vortex.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            

            if (dist < vortex.radius && dist > 10) {

              // Tangential velocity for vortex flow

              const angle = Math.atan2(dy, dx) + Math.PI / 2 + vortex.rotation;

              const speed = vortex.strength * (1 - dist / vortex.radius) * 0.5;

              p.vx += Math.cos(angle) * speed;

              p.vy += Math.sin(angle) * speed;

              

              // Radial inflow/outflow

              const radialForce = (dist - vortex.radius / 2) * 0.0002;

              p.vx += dx / dist * radialForce;

              p.vy += dy / dist * radialForce;

            }

          });

        });

      }

    }

    

    // ===== VORTEX ENGINE =====

    class VortexEngine {

      init(galaxy) {

        this.galaxy = galaxy;

        this.blackHoles = [];

        this.createBlackHoles();

      }

      

      createBlackHoles() {

        // Create central black hole-like vortices

        this.blackHoles.push({

          x: this.galaxy.width / 2,

          y: this.galaxy.height / 2,

          mass: 1000,

          eventHorizon: 80,

          accretionDisk: 150,

          rotation: 0,

          rotationSpeed: 0.0005

        });

        

        // Add smaller satellite vortices

        for (let i = 0; i < 2; i++) {

          this.blackHoles.push({

            x: this.galaxy.width / 2 + Math.cos(i * Math.PI) * 200,

            y: this.galaxy.height / 2 + Math.sin(i * Math.PI) * 200,

            mass: 300,

            eventHorizon: 40,

            accretionDisk: 100,

            rotation: Math.random() * Math.PI * 2,

            rotationSpeed: (Math.random() - 0.5) * 0.002

          });

        }

      }

      

      update(deltaTime, galaxy) {

        // Update black holes

        this.blackHoles.forEach(bh => {

          bh.rotation += bh.rotationSpeed * deltaTime;

          

          // Apply gravitational lensing effect to particles

          galaxy.particles.forEach(p => {

            const dx = bh.x - p.x;

            const dy = bh.y - p.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            

            if (dist < bh.accretionDisk && dist > bh.eventHorizon) {

              // Spiral inflow towards black hole

              const angle = Math.atan2(dy, dx) + bh.rotation;

              const force = bh.mass * 0.000001 / (dist * dist);

              p.vx += Math.cos(angle) * force;

              p.vy += Math.sin(angle) * force;

              

              // Add tangential velocity for accretion disk

              const tangentialAngle = angle + Math.PI / 2;

              const tangentialSpeed = Math.sqrt(bh.mass / dist) * 0.0001;

              p.vx += Math.cos(tangentialAngle) * tangentialSpeed;

              p.vy += Math.sin(tangentialAngle) * tangentialSpeed;

            }

          });

        });

      }

    }

    

    // ===== HELP SYSTEM =====

    class HelpSystem {

      constructor() {

        this.tooltip = document.getElementById('help-tooltip');

        this.visible = false;

        this.lastUpdate = 0;

      }

      

      update() {

        // Auto-hide after delay

        if (this.visible && Date.now() - this.lastUpdate > 5000) {

          this.hide();

        }

      }

      

      updateTooltip(x, y) {

        this.lastUpdate = Date.now();

        

        // Determine what's under the mouse

        const info = this.getInfoAtPosition(x, y);

        

        this.tooltip.innerHTML = `

          <div style="font-weight: bold; color: #00ffff; margin-bottom: 8px;">${info.title}</div>

          <div style="color: #ffffcc; line-height: 1.4;">${info.content}</div>

        `;

        

        this.tooltip.style.left = `${x + 15}px`;

        this.tooltip.style.top = `${y - 10}px`;

        this.tooltip.classList.add('visible');

        this.visible = true;

      }

      

      getInfoAtPosition(x, y) {

        // Check if mouse is over a node

        if (this.galaxy && this.galaxy.nodes) {

          for (const node of this.galaxy.nodes) {

            const dx = x - node.x;

            const dy = y - node.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            

            if (dist < node.size + 20) {

              return {

                title: node.name,

                content: `Category: ${node.category}<br>Connections: ${node.connections.length}<br>Charge: ${node.charge.toFixed(1)}<br>Mass: ${node.mass.toFixed(1)}`

              };

            }

          }

        }

        

        // Default help

        return {

          title: "Quantum Plasma Galaxy",

          content: "Explore your knowledge vault as a living cosmos:<br>• Nodes = your notes<br>• Links = connections<br>• Plasma = magnetic fields<br>• Liquid = fluid dynamics<br>• Vortices = knowledge flow<br><br>Hover nodes for details<br>Drag to interact<br>Use controls to adjust physics"

        };

      }

      

      hide() {

        this.tooltip.classList.remove('visible');

        this.visible = false;

      }

    }

    

    // ===== PERFORMANCE MONITOR =====

    class PerformanceMonitor {

      constructor() {

        this.lastTime = 0;

        this.frameCount = 0;

        this.fps = 0;

      }

      

      update() {

        const now = Date.now();

        if (now - this.lastTime >= 1000) {

          this.fps = Math.round(this.frameCount * 1000 / (now - this.lastTime));

          this.frameCount = 0;

          this.lastTime = now;

        } else {

          this.frameCount++;

        }

      }

    }

    

    // ===== INITIALIZE THE GALAXY =====

    let galaxy = null;

    

    // Start initialization when DOM is ready

    if (document.readyState === 'loading') {

      document.addEventListener('DOMContentLoaded', () => {

        galaxy = new QuantumGalaxy();

      });

    } else {

      galaxy = new QuantumGalaxy();

    }

    

    // Expose for debugging

    window.galaxy = galaxy;
