body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        
        Users see the warning:

        ```
        ⚠ Context is over the compression threshold (~456,379 tokens >= 131,072)
        but compression is currently blocked (cooldown:60).
        ```

        even after configuration changes (`compression.threshold: 0.5`, `abort_on_summary_failure: false`).
        The transient backoff (hard‑coded 60 s, 300 s, 900 s) prevents compression from being scheduled, leading to:

        1. Growing session context until the fixed context‑window limit is reached.
        2. No fallback to manual `/compress` because the warning frames the inability to compress as a hard block.
        3. Unexpected pauses during long‑running analysis tasks (e.g., large code review or research sessions).

        **Why this matters**
        - The fixability is blocked, creating a direct performance bottleneck for users with long sessions.
        - With the default hard‑coded cooldowns users have no way to increase or decrease aggressiveness without editing source code.

        **Current evidence**
        - Logs show `"compression is currently blocked ({reason})."` with `reason` containing `"cooldown:60"`.
        - Hard‑coded `_TIMEOUT_COOLDOWN_LADDER = (60, 300, 900)` in `agent/context_compressor.py`.
        - No configuration exposure: the ladder is not tunable from `config.yaml` or any runtime config.

        **Reproduction steps**
        1. Start Hermes agent with user’s current `config.yaml` (default config or custom).
        2. Generate / consume session context above `compression.threshold` (e.g., long multi‑step coding workflow).
        3. Observe the warning message and pause until cooldown expires (or run `/compress` manually).

        **Expected behavior**
        - Users should be able to configure the transient backoff ladder via `config.yaml`.
        - The ladder should respect the same level as other configurable knobs (`threshold`, `target_ratio`, `abort_on_summary_failure`).
        - The assistant should emit actionable information: the numeric cooldown value, the reason, and a suggestion for manual `/compress` or session reset (`/new`).

        **Proposed solution**
        - Add a `compression.cooldown` dict in `config.yaml` with fields `transient:` (list of seconds) and `summary_failure_seconds:` (existing integer).
        - In `agent/context_compressor.py`, read the ladder from config, falling back to hard‑coded defaults.
        - Replace the hard‑coded `_TIMEOUT_COOLDOWN_LADDER` and 60‑s `transient_cooldown` assignment with the configurable ladder.
        - Adjust documentation / context‑completion notice to reflect the config structure.
    validation: |
      - [ ] Proposed changes compile and pass existing tests.
      - [ ] New config key is documented in `CONTRIBUTING.md` / `docs/plans`.
      - [ ] CLI output and log messages respect the configured values.
      - [ ] Tests verify that a custom ladder overrides the default (e.g., set `compression.cooldown.transient: [20, 60, 180]` and confirm compression is no longer blocked after 20 seconds when a timeout occurs).

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Add a new `compression.cooldown` configuration block in `~/.hermes/config.yaml` to make the transient backoff ladder and the summary‑failure cooldown tunable without code changes.
        
        ```yaml
        compression:
          enabled: true
          threshold: 0.5
          target_ratio: 0.35
          protect_last_n: 2
          hygiene_hard_message_limit: 400
          protect_first_n: 3
          abort_on_summary_failure: false
          # ========== NEW ==========
          cooldown:
            # Transient cooldown ladder (seconds) applied after summary‑LLM errors/timeouts.
            # The i‑th error (0‑based) uses ladder[i]; the list length can be 1‑3.
            transient: [60, 300, 900]
            # Summary‑failure cooldown (seconds) — same as before. Override by providing
            # summary_failure_seconds in minutes; the internal conversion is `x * 60`.
            summary_failure_seconds: 600
          # ===========================
          codex_gpt55_autoraise: false
          in_place: true
          auxiliary:
            model: openrouter/meta-llama/llama-3.1-8b-instruct
            provider: openrouter
        ```
        
        - Load the config values at runtime in `agent/context_compressor.py` (or via :func:`legacy_context.engine.load_compression_config` if such a helper exists) and replace the hard‑coded `(60, 300, 900)` ladder.
        - Add a fallback path: if `compression.cooldown` or any sub‑key is missing, use the original hard‑coded defaults to preserve backward compatibility.
        - When generating the cooldown reason, include the numeric remaining seconds (`cooldown:<seconds>`) as before. The value should reflect the actual ladder entry (e.g., `cooldown:60` for first failure).
        - Update `hermes-context-compression` (the skill that diagnoses compression issues) to document the new config key and provide examples of how a user can adjust it.
        - Add tests in `tests/agent/test_context_compressor.py` (or similar) to verify:
          1. `config.yaml` with a custom ladder influences the transient cooldown length.
          2. The ladder is used on successive timeouts/failures (i.e., after second failure, ladder[1] = 300).
          3. Manual `/compress` bypasses the transient cooldown (it already does).
    notes: |
      - The change is additive; every existing deployment will continue to work with the hard‑coded defaults until they opt‑in.
      - The naming follows existing patterns in `config.yaml` (e.g., `compression.threshold`, `compression.target_ratio`).
      - No breaking changes are introduced. All affected functions are defensive about missing config.
      
  - type: textarea
    id: commands-to-validate
    attributes:
      label: How to validate locally
      description: |
        1. Copy the example `compression.cooldown` block from the proposal into `~/.hermes/config.yaml`.
        2. Provide a custom ladder, e.g., `transient: [20, 60, 180]`.
        3. Simulate a summarization error (e.g., cause an auxiliary model request timeout; in tests you can mock the network call).
        4. Run the relevant unit test suite (`pytest tests/agent/test_context_compressor.py`).
        5. Assert that the cooldown reason includes the newly configured seconds (e.g., `cooldown:20`).
        6. If no existing tests cover timeouts, add a small mock test that directly calls `agent.context_compressor.ContextCompressor` methods that modify `_summary_failure_cooldown_until` and `_consecutive_timeout_failures`.
    
  - type: textarea
    id: questions
    attributes:
      label: Questions
      description: |
        - Are there any other places in the codebase where the hard‑coded `(60, 300, 900)` appears that I missed?
        - Should I also make the summary‑failure cooldown (`summary_failure_seconds`) configurable? It already is via the newly added key.
        - Is the `transient:` ladder meant to apply only to time‑outs or also to quota/auth failures? Currently only timeouts are tracked. Might need to clarify.
        - Does the existing test suite need any additional coverage for the new config path? If yes, I'll prepare a separate patch. 

  - type: textarea
    id: related-mr-issues
    attributes:
      label: Related MR / Issue references
      description: |
        References:
        - #<issue_number> (if any; fill if there is a linked issue)
        - discuss/memo regarding the compression backoff.
        - Slack thread #compression-cooldown-feedback (replace with your internal reference)
        
        Tips for linking: use the raw GitHub issue number (e.g., `#42`) or a short reference like `⚡compression/cooldown-configurable`.

  - type: textarea
    id: author-suggestions
    attributes:
      label: Author suggestions
      description: |
        - Should I add a dedicated test file in `skills/devops/hermes-context-compression/references/`?
        - Should I generate a simple markdown doc (`docs/plans/compression-cooldown-configurable.md`) summarizing the changes for future maintainers?
        - Any style suggestions for the code (e.g., snake_case variable naming for reading config).
        - The PR is expected to be merged to the `main` branch (already protected). Any merge requirements I'm not aware of? Use the standard GITHUB token strategy as documented in the repo.