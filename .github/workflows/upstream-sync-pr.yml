name: Upstream Sync PR
# Fork setup required for this workflow to create PRs:
#   Settings → Actions → General → Workflow permissions:
#     ✓ "Allow GitHub Actions to create and approve pull requests"
#   Without this, gh pr create fails with:
#     "GitHub Actions is not permitted to create or approve pull requests"
#   The `pull-requests: write` permission below is necessary but not sufficient —
#   the repository setting is a separate security gate.

on:
  schedule:
    # Every 4 hours, offset from top-of-hour GitHub Actions congestion.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-pr
  cancel-in-progress: true

jobs:
  sync:
    name: Create reviewed upstream sync PR
    if: github.repository == 'pai-scaffolde/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Detect GitHub App credentials
        id: app-auth
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "has_app_token=true" >> "$GITHUB_OUTPUT"
            echo "token_source=github-app" >> "$GITHUB_OUTPUT"
          else
            echo "has_app_token=false" >> "$GITHUB_OUTPUT"
            echo "token_source=github-token" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_ID/APP_PRIVATE_KEY are not configured; falling back to GITHUB_TOKEN. Branch pushes/PR updates may not trigger every downstream workflow automatically."
          fi

      # Prefer repository GitHub App credentials so branch pushes/PR updates
      # trigger the normal pull_request CI gates. When the app is not installed,
      # keep the scheduled sync alive with GITHUB_TOKEN and make the weaker
      # downstream-trigger behavior explicit in the logs.
      - name: Generate GitHub App token
        id: app-token
        if: steps.app-auth.outputs.has_app_token == 'true'
        uses: actions/create-github-app-token@7bfa3a4717ef143a604ee0a99d859b8886a96d00 # v1.9.3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Create or update upstream sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          BRANCH: automation/upstream-sync
          UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
          TOKEN_SOURCE: ${{ steps.app-auth.outputs.token_source }}
        run: |
          set -euo pipefail

          if [ "$TOKEN_SOURCE" = "github-token" ]; then
            echo "::notice::Using GITHUB_TOKEN fallback because APP_ID/APP_PRIVATE_KEY are absent. Reviewers may need to rerun PR checks manually."
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "$UPSTREAM_URL"
          git fetch origin main
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "Fork main already contains upstream/main; nothing to sync."
            exit 0
          fi

          git checkout -B "$BRANCH" origin/main

          # Reviewed upstream-merge model: preserve the current Scaffolde fork
          # contract and merge Nous upstream into a PR branch. The fork has a large
          # accumulated patch-stack history, so replaying every historical fork
          # commit on every sync is no longer a reliable maintenance path.
          if ! git merge --no-ff --no-edit upstream/main; then
            git merge --abort || true
            {
              echo "### Upstream sync needs manual merge resolution"
              echo ""
              echo "Merging upstream/main into the Scaffolde fork hit conflicts."
              echo ""
              echo "Resolve locally on a sync branch, preserving the Scaffolde fork contract, then open/update a reviewed PR:"
              echo ""
              echo '```bash'
              echo "git fetch origin upstream"
              echo "git checkout -B sync/nous-upstream-$(date +%Y%m%d) origin/main"
              echo "git merge upstream/main"
              echo "# resolve conflicts, then:"
              echo "git push -u origin HEAD"
              echo "gh pr create --base main --head <branch>"
              echo '```'
              echo ""
              echo "The existing $BRANCH branch was left untouched."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
              echo "::warning::Merging upstream/main into the Scaffolde fork hit conflicts. Scheduled runs report this as manual sync required without failing repeatedly."
              exit 0
            fi

            echo "::error::Merging upstream/main into the Scaffolde fork hit conflicts."
            echo "Resolve locally on a sync branch, preserving the Scaffolde fork contract, then open/update a reviewed PR:"
            echo "  git fetch origin upstream"
            echo "  git checkout -B sync/nous-upstream-$(date +%Y%m%d) origin/main"
            echo "  git merge upstream/main"
            echo "  # resolve conflicts, then:"
            echo "  git push -u origin HEAD"
            echo "Left the existing $BRANCH untouched for manual resolution."
            exit 1
          fi

          git push --force-with-lease origin "HEAD:$BRANCH"

          cat > /tmp/upstream-sync-pr-body.md <<'EOF'
          Automated upstream sync from NousResearch/hermes-agent into pai-scaffolde/hermes-agent.

          This branch merges `upstream/main` into the current Scaffolde fork main while
          preserving the fork contract. Review the diff and let CI run here.

          Policy:
          - This PR is review-gated. Do not auto-merge blindly.
          - Existing CI/checks must pass before landing.
          - Land with a normal reviewed merge commit. Do not squash; squashing hides
            the upstream merge boundary and makes the next sync harder to inspect.
          - If the workflow used the GITHUB_TOKEN fallback, PR checks may need a
            manual rerun because workflow-created pushes do not always trigger
            downstream workflows.
          - If the merge conflicted, this PR was not updated; resolve locally per the
            failed job log and open/update a reviewed sync PR.

          Source:
          - upstream: NousResearch/hermes-agent main
          - fork base: pai-scaffolde/hermes-agent main (PAI patch stack)
          EOF

          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync from NousResearch/hermes-agent upstream" \
              --body-file /tmp/upstream-sync-pr-body.md
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync from NousResearch/hermes-agent upstream" \
              --body-file /tmp/upstream-sync-pr-body.md
          fi
