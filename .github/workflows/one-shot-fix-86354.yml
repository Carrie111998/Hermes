          test_block = '''class TestEndpointScopedAppPassword(unittest.TestCase):
    """Credential mutation is authorized by the selected mail endpoint."""

    def test_google_dns_label_boundaries(self):
        from plugins.platforms.email.adapter import _is_google_auth_endpoint

        accepted = (
            "gmail.com",
            "SMTP.GMAIL.COM",
            "imap.gmail.com.",
            "googlemail.com",
            "imap.googlemail.com",
        )
        rejected = (
            "evilgmail.com",
            "gmail.com.evil.example",
            "example.com",
            "",
        )
        for host in accepted:
            with self.subTest(host=host):
                self.assertTrue(_is_google_auth_endpoint(host))
        for host in rejected:
            with self.subTest(host=host):
                self.assertFalse(_is_google_auth_endpoint(host))

    def test_exact_google_display_form_is_compacted(self):
        from plugins.platforms.email.adapter import _password_for_auth_endpoint

        raw = "abcd efgh ijkl mnop"
        self.assertEqual(
            _password_for_auth_endpoint(raw, "imap.gmail.com"),
            "abcdefghijklmnop",
        )
        self.assertEqual(
            _password_for_auth_endpoint(raw, "smtp.googlemail.com"),
            "abcdefghijklmnop",
        )

    def test_non_google_same_shaped_credential_is_byte_preserved(self):
        from plugins.platforms.email.adapter import _password_for_auth_endpoint

        raw = "abcd efgh ijkl mnop"
        self.assertEqual(_password_for_auth_endpoint(raw, "imap.example.com"), raw)
        self.assertEqual(_password_for_auth_endpoint(raw, "smtp.gmail.com.evil"), raw)

    def test_nonmatching_credentials_preserve_outer_and_inner_whitespace(self):
        from plugins.platforms.email.adapter import _password_for_auth_endpoint

        for raw in (
            "  abcd efgh ijkl mnop  ",
            "my pass word with spaces",
            "\tabcd efgh ijkl mnop\n",
        ):
            with self.subTest(raw=repr(raw)):
                self.assertEqual(_password_for_auth_endpoint(raw, "smtp.gmail.com"), raw)
                self.assertEqual(_password_for_auth_endpoint(raw, "smtp.example.com"), raw)

    def test_imap_and_smtp_endpoints_authorize_independently(self):
        from plugins.platforms.email.adapter import _password_for_auth_endpoint

        raw = "abcd efgh ijkl mnop"
        self.assertEqual(
            _password_for_auth_endpoint(raw, "imap.gmail.com"),
            "abcdefghijklmnop",
        )
        self.assertEqual(
            _password_for_auth_endpoint(raw, "smtp.example.com"),
            raw,
        )
        self.assertEqual(
            _password_for_auth_endpoint(raw, "imap.example.com"),
            raw,
        )
        self.assertEqual(
            _password_for_auth_endpoint(raw, "smtp.gmail.com"),
            "abcdefghijklmnop",
        )

    def test_adapter_stores_credential_verbatim(self):
        from gateway.config import PlatformConfig
        from plugins.platforms.email.adapter import EmailAdapter

        raw = "  abcd efgh ijkl mnop  "
        with patch.dict(os.environ, {
            "EMAIL_ADDRESS": "hermes@example.com",
            "EMAIL_PASSWORD": raw,
            "EMAIL_IMAP_HOST": "imap.gmail.com",
            "EMAIL_SMTP_HOST": "smtp.example.com",
        }, clear=True):
            adapter = EmailAdapter(PlatformConfig(enabled=True))
        self.assertEqual(adapter._password, raw)

    def test_every_login_boundary_uses_endpoint_qualified_helper(self):
        import ast
        import inspect
        import plugins.platforms.email.adapter as email_adapter

        tree = ast.parse(inspect.getsource(email_adapter))
        observed = []
        for node in ast.walk(tree):
            if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Attribute):
                continue
            if node.func.attr != "login" or len(node.args) < 2:
                continue
            observed.append((ast.unparse(node.func.value), ast.unparse(node.args[1])))

        self.assertEqual(len(observed), 7)
        expected_hosts = {
            "imap": "self._imap_host",
            "smtp": "self._smtp_host",
            "server": "smtp_host",
        }
        for receiver, password_expr in observed:
            with self.subTest(receiver=receiver, expression=password_expr):
                self.assertIn(receiver, expected_hosts)
                self.assertEqual(
                    password_expr,
                    f"_password_for_auth_endpoint(self._password, {expected_hosts[receiver]})"
                    if receiver != "server"
                    else "_password_for_auth_endpoint(password, smtp_host)",
                )


class TestHelperFunctions(unittest.TestCase):
    """Test email parsing helper functions."""
