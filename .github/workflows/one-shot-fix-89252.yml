name: One-shot current transport claimant proof

on:
  push:
    branches:
      - fix/88715-canonical-multiplex-identity

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/88715-canonical-multiplex-identity
          fetch-depth: 0

      - name: Recover, verify, compose, and publish claimant proof
        run: |
          set -euo pipefail
          trigger_head="$(git rev-parse HEAD)"
          branch=fix/88715-canonical-multiplex-identity
          carrier_commit=caa2b08bcc6e7abe56736fdada36738e01f18557
          carrier_path=.github/workflows/complete-89252-claim-proof.yml

          git fetch --no-tags origin "${carrier_commit}"
          git show "${carrier_commit}:${carrier_path}" > /tmp/claim-carrier.yml

          python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/claim-carrier.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          body = []
          for line in lines:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line:
                  body.append('')
              else:
                  raise SystemExit(f'unexpected carrier indentation: {line!r}')
          Path('/tmp/apply-claim-proof.py').write_text('\n'.join(body) + '\n')
          PY

          python -m py_compile /tmp/apply-claim-proof.py
          python /tmp/apply-claim-proof.py

          rm -f \
            .github/workflows/complete-89252-claim-proof.yml \
            .github/workflows/build-89252-claim-proof-artifact.yml \
            .github/workflows/one-shot-fix-89252.yml

          python -m pip install --disable-pip-version-check -q 'uv==0.9.28'
          uv run ruff check --fix \
            gateway/routing_identity.py \
            tests/gateway/test_routing_identity.py \
            tests/gateway/test_transport_claim_generation.py
          uv run ruff format \
            gateway/routing_identity.py \
            tests/gateway/test_routing_identity.py \
            tests/gateway/test_transport_claim_generation.py
          python -m py_compile gateway/routing_identity.py
          uv run pytest -q \
            tests/gateway/test_routing_identity.py \
            tests/gateway/test_transport_claim_generation.py
          git diff --check

          git config user.name "andrexibiza"
          git config user.email "84248988+andrexibiza@users.noreply.github.com"
          git add -A
          git commit -m "fix(gateway): require current transport claimant proof"

          current_main="$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | awk 'NR==1 {print $1}')"
          test -n "${current_main}"
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git "${current_main}"
          test "$(git rev-parse FETCH_HEAD)" = "${current_main}"
          git merge --no-ff --no-edit "${current_main}"

          uv run pytest -q \
            tests/gateway/test_routing_identity.py \
            tests/gateway/test_transport_claim_generation.py
          python -m py_compile gateway/routing_identity.py
          git diff --check
          git merge-base --is-ancestor "${trigger_head}" HEAD
          git merge-base --is-ancestor "${current_main}" HEAD

          git push \
            --force-with-lease="refs/heads/${branch}:${trigger_head}" \
            origin "HEAD:refs/heads/${branch}"
