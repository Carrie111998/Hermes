name: Finalize bot-scoped activity transcripts

on:
  pull_request:
    branches:
      - codex/bot-activity-clean-base
    paths:
      - .github/workflows/codex-bot-activity-validate.yml
      - apps/desktop/src/plugins/hermes-bots/plugin.js
      - apps/desktop/src/plugins/hermes-bots/tests/**

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'codex/bot-scoped-activity-transcripts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/bot-scoped-activity-transcripts
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Keep the drawer strictly scoped when switching bots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('apps/desktop/src/plugins/hermes-bots/plugin.js')
          source = plugin.read_text(encoding='utf-8')
          old = """            }
          })
        : null,
      jsx(GroupChatSettingsDialog, {"""
          new = """            }
          }, groupMemberKey(selectedActivityMember))
        : null,
      jsx(GroupChatSettingsDialog, {"""
          if new not in source:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one drawer render anchor, found {count}')
              plugin.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('apps/desktop/src/plugins/hermes-bots/tests/group-activity-transcript.test.mjs')
          tests = test.read_text(encoding='utf-8')
          assertion = "  assert.match(source, /}, groupMemberKey\\(selectedActivityMember\\)\\)/)\n"
          if assertion not in tests:
              anchor = "  assert.match(source, /private model reasoning is never displayed/)\n"
              count = tests.count(anchor)
              if count != 1:
                  raise SystemExit(f'expected one scope-test anchor, found {count}')
              tests = tests.replace(
                  anchor,
                  anchor
                  + "  // Switching bots remounts the drawer so a newly selected bot never\n"
                  + "  // inherits the previous bot's transcript snapshot.\n"
                  + assertion,
                  1,
              )
              test.write_text(tests, encoding='utf-8')
          PY

      - name: Parse plugin
        run: node --check apps/desktop/src/plugins/hermes-bots/plugin.js

      - name: Run focused transcript and group-chat regressions
        run: |
          node --test \
            apps/desktop/src/plugins/hermes-bots/tests/group-activity-transcript.test.mjs \
            apps/desktop/src/plugins/hermes-bots/tests/group-activity.test.mjs \
            apps/desktop/src/plugins/hermes-bots/tests/group-chat.test.mjs \
            apps/desktop/src/plugins/hermes-bots/tests/group-room-ux.test.mjs \
            apps/desktop/src/plugins/hermes-bots/tests/group-mention-composer.test.mjs

      - name: Run complete Bots plugin suite
        run: node --test apps/desktop/src/plugins/hermes-bots/tests/*.test.mjs

      - name: Rewrite as one clean feature commit
        shell: bash
        run: |
          rm -f .github/workflows/codex-bot-activity-validate.yml
          rm -f .github/workflows/codex-fix-bot-activity-scope.yml
          rm -f apps/desktop/src/plugins/hermes-bots/tests/.codex-bot-activity-trigger
          git diff --check
          git reset --soft 0287dfb0c2874c8716d27cf6a654a42b716be5e0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(desktop): add bot-scoped group activity transcripts'
          git push --force origin HEAD:codex/bot-scoped-activity-transcripts
