name: Apply PR 93081 review fixes v3

on:
  push:
    branches:
      - fix/git-free-desktop-bootstrap

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review fixes
        run: python .github/patch-pr-93081.py

      - name: Verify targeted regression suite
        run: |
          bash -n scripts/install.sh
          uv run --with pytest pytest -q tests/test_install_git_free_release_runtime.py tests/test_install_no_initial_commit.py tests/test_install_sh_bootstrap_marker.py tests/test_install_sh_install_method_stamp.py

      - name: Commit verified fixes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-pr-93081.py .github/workflows/apply-pr-93081-review-fixes-v3.yml
          git add apps/bootstrap-installer/src-tauri/src/bootstrap.rs scripts/install.sh tests/test_install_git_free_release_runtime.py tests/test_install_sh_install_method_stamp.py
          git commit -m "fix(installer): harden git-free release provenance"
          git push
