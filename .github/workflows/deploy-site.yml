name: Deploy Site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - 'scripts/build_skills_index.py'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - 'scripts/build_skills_index.py'
      - '.github/workflows/deploy-site.yml'
  schedule:
    # Run twice daily: 6 AM and 6 PM UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-vercel:
    if: github.repository == 'NousResearch/hermes-agent' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

  build-skills-index:
    # Only run on the upstream repository, not on forks
    if: github.repository == 'NousResearch/hermes-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.13
          source .venv/bin/activate
          uv pip install httpx==0.28.1 pyyaml==6.0.2
      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python scripts/build_skills_index.py
      - name: Upload index artifact
        uses: actions/upload-artifact@b4b15b8c7cac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7

  deploy-docs:
    needs: [build-skills-index]
    if: |
      always() &&
      github.repository == 'NousResearch/hermes-agent' &&
      (needs.build-skills-index.result == 'success' || needs.build-skills-index.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name != 'pull_request' && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.13'
      - name: Download skills index
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: skills-index
          path: website/static/api/

      - name: Install build dependencies
        run: |
          uv venv .venv --python 3.13
          source .venv/bin/activate
          uv pip install pyyaml==6.0.2 httpx==0.28.1

      - name: Extract skill metadata
        run: .venv/bin/python website/scripts/extract-skills.py

      - name: Regenerate skill docs
        run: .venv/bin/python website/scripts/generate-skill-docs.py

      - name: Build skills index (fallback)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f website/static/api/skills-index.json ]; then
            .venv/bin/python scripts/build_skills_index.py || echo "Skills index build failed"
          fi

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Stage deployment
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          echo "hermes-agent.nousresearch.com" > _site/CNAME
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
