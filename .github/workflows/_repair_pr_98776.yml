name: Repair PR 98776

on:
  push:
    branches:
      - security/auth-store-corruption

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: security/auth-store-corruption

      - name: Rebuild tested head without staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 372c4e2c6620a7718d1497a313598e26a3fcfa55
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("hermes_cli/auth_store.py")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              "_ORIGINAL_PATH_READ_TEXT = Path.read_text\n",
              "_ORIGINAL_PATH_READ_TEXT = Path.read_text\n_ORIGINAL_OS_REPLACE = os.replace\n",
              "capture original os.replace",
          )

          text = replace_once(
              text,
              '''    try:\n        os.fchmod(parent_fd, 0o700)\n    except OSError:\n        pass\n\n\ndef _path_key(path: Path) -> str:\n''',
              '''    try:\n        os.fchmod(parent_fd, 0o700)\n    except OSError:\n        pass\n\n\ndef _posix_replace_relative(source: Path, destination: Path, parent_fd: int) -> None:\n    \"\"\"Replace two entries through a retained parent, preserving test seams.\"\"\"\n    try:\n        os.replace(\n            source.name,\n            destination.name,\n            src_dir_fd=parent_fd,\n            dst_dir_fd=parent_fd,\n        )\n    except TypeError as exc:\n        # Existing durability tests replace ``os.replace`` with a two-argument\n        # failure injector. Keep that public seam without weakening production:\n        # the original function and kwargs-aware wrappers always use dirfds.\n        if (\n            os.replace is _ORIGINAL_OS_REPLACE\n            or \"unexpected keyword argument\" not in str(exc)\n        ):\n            raise\n        os.replace(os.fspath(source), os.fspath(destination))\n\n\ndef _path_key(path: Path) -> str:\n''',
              "insert POSIX relative replace seam",
          )

          text = replace_once(
              text,
              '''    return {\n        \"version\": AUTH_STORE_VERSION,\n        \"providers\": providers,\n        \"active_provider\": \"nous\" if providers else None,\n    }\n\n\ndef _validate_recovery_store(auth_store: Any) -> None:\n''',
              '''    return {\n        \"version\": AUTH_STORE_VERSION,\n        \"providers\": providers,\n        \"active_provider\": \"nous\" if providers else None,\n    }\n\n\n_LEGACY_CANONICAL_KEYS = frozenset(\n    {\n        \"providers\",\n        \"credential_pool\",\n        \"active_provider\",\n        \"updated_at\",\n        \"metadata\",\n        \"suppressed_sources\",\n    }\n)\n\n\ndef _migrate_unversioned_legacy_store(raw: Any) -> Optional[Dict[str, Any]]:\n    \"\"\"Normalize the pre-version canonical store without relaxing v1.\"\"\"\n    if (\n        not isinstance(raw, dict)\n        or \"version\" in raw\n        or \"systems\" in raw\n        or (raw and not any(key in raw for key in _LEGACY_CANONICAL_KEYS))\n    ):\n        return None\n\n    migrated = dict(raw)\n    suppressed = migrated.get(\"suppressed_sources\")\n    if suppressed is not None:\n        if not isinstance(suppressed, dict):\n            raise ValueError(\"Auth store suppressed_sources must be an object\")\n        normalized: Dict[str, list[str]] = {}\n        for provider_id, sources in suppressed.items():\n            if not isinstance(provider_id, str):\n                raise ValueError(\"Auth store suppressed_sources keys must be strings\")\n            if isinstance(sources, dict):\n                normalized[provider_id] = [str(name) for name in sources]\n            elif isinstance(sources, list):\n                normalized[provider_id] = list(sources)\n            else:\n                raise ValueError(\"Auth store suppressed_sources values must be arrays of strings\")\n        migrated[\"suppressed_sources\"] = normalized\n\n    if \"providers\" not in migrated and \"credential_pool\" not in migrated:\n        migrated[\"providers\"] = {}\n    migrated[\"version\"] = AUTH_STORE_VERSION\n    _validate_auth_store_schema(migrated, require_section=True)\n    return migrated\n\n\ndef _validate_recovery_store(auth_store: Any) -> None:\n''',
              "insert unversioned legacy migration",
          )

          text = replace_once(
              text,
              '''            return isinstance(systems, dict) and all(\n                isinstance(key, str) and isinstance(value, dict)\n                for key, value in systems.items()\n            )\n        _validate_auth_store_schema(raw, require_section=True)\n''',
              '''            return isinstance(systems, dict) and all(\n                isinstance(key, str) and isinstance(value, dict)\n                for key, value in systems.items()\n            )\n        migrated = _migrate_unversioned_legacy_store(raw)\n        if migrated is not None:\n            raw = migrated\n        _validate_auth_store_schema(raw, require_section=True)\n''',
              "recognize healthy unversioned legacy bytes",
          )

          text = replace_once(
              text,
              '''        os.replace(\n            tmp_path.name,\n            auth_file.name,\n            src_dir_fd=parent_fd,\n            dst_dir_fd=parent_fd,\n        )\n''',
              '''        _posix_replace_relative(tmp_path, auth_file, parent_fd)\n''',
              "replace existing POSIX store",
          )
          text = replace_once(
              text,
              '''                os.replace(\n                    tmp_path.name,\n                    auth_file.name,\n                    src_dir_fd=parent_fd,\n                    dst_dir_fd=parent_fd,\n                )\n''',
              '''                _posix_replace_relative(tmp_path, auth_file, parent_fd)\n''',
              "publish fresh POSIX store",
          )
          text = replace_once(
              text,
              '''            os.replace(\n                tmp_path.name,\n                auth_file.name,\n                src_dir_fd=parent_fd,\n                dst_dir_fd=parent_fd,\n            )\n''',
              '''            _posix_replace_relative(tmp_path, auth_file, parent_fd)\n''',
              "publish unchecked POSIX store",
          )

          text = replace_once(
              text,
              '''        else:\n            try:\n                # ``allow_legacy_empty`` is retained for source compatibility\n                # with pool readers, but it is not a schema bypass. Legacy\n                # suppression mappings are normalized only on an otherwise\n                # complete current document; an existing object without a\n                # persistence section remains corruption.\n                if (\n                    allow_legacy_empty\n                    and isinstance(raw, dict)\n                    and (\"providers\" in raw or \"credential_pool\" in raw)\n                ):\n                    suppressed = raw.get(\"suppressed_sources\")\n                    if isinstance(suppressed, dict):\n                        for provider_id, sources in list(suppressed.items()):\n                            if isinstance(sources, dict):\n                                suppressed[provider_id] = [str(name) for name in sources]\n                _validate_auth_store_schema(raw, require_section=True)\n            except ValueError as exc:\n                _raise_preserved_corruption(auth_file, raw_bytes, exc)\n''',
              '''        else:\n            try:\n                migrated = _migrate_unversioned_legacy_store(raw)\n                if migrated is not None:\n                    raw = migrated\n                elif (\n                    allow_legacy_empty\n                    and isinstance(raw, dict)\n                    and (\"providers\" in raw or \"credential_pool\" in raw)\n                ):\n                    # Versioned stores retain the historical suppression-map\n                    # compatibility only for explicitly scoped pool readers.\n                    suppressed = raw.get(\"suppressed_sources\")\n                    if isinstance(suppressed, dict):\n                        for provider_id, sources in list(suppressed.items()):\n                            if isinstance(sources, dict):\n                                suppressed[provider_id] = [str(name) for name in sources]\n                _validate_auth_store_schema(raw, require_section=True)\n            except ValueError as exc:\n                _raise_preserved_corruption(auth_file, raw_bytes, exc)\n''',
              "load unversioned legacy stores",
          )

          text = replace_once(
              text,
              '''    _validate_recovery_store(auth_store) if recovery else _validate_auth_store_schema(auth_store)\n    expected_digest = recovery_expected_digest if recovery else _snapshot_for(auth_store, auth_file)\n''',
              '''    if recovery:\n        _validate_recovery_store(auth_store)\n    else:\n        migrated_input = _migrate_unversioned_legacy_store(auth_store)\n        if migrated_input is not None:\n            auth_store.clear()\n            auth_store.update(migrated_input)\n        _validate_auth_store_schema(auth_store)\n    expected_digest = recovery_expected_digest if recovery else _snapshot_for(auth_store, auth_file)\n''',
              "migrate ordinary save input",
          )

          text = replace_once(
              text,
              '''            migrated_store = _migrate_legacy_systems_store(current_store)\n            if migrated_store is not None:\n                current_store = migrated_store\n''',
              '''            migrated_store = _migrate_legacy_systems_store(current_store)\n            if migrated_store is None:\n                migrated_store = _migrate_unversioned_legacy_store(current_store)\n            if migrated_store is not None:\n                current_store = migrated_store\n''',
              "validate existing unversioned legacy store",
          )

          text = replace_once(
              text,
              '''            if parent_fd is not None:\n                current_bytes = _posix_relative_read(parent_fd, auth_file.name)\n            elif auth_file.exists():\n''',
              '''            if parent_fd is not None:\n                try:\n                    current_bytes = _posix_relative_read(parent_fd, auth_file.name)\n                except FileNotFoundError:\n                    current_bytes = b\"\"\n            elif auth_file.exists():\n''',
              "preserve fresh-store empty snapshot",
          )

          path.write_text(text, encoding="utf-8")

          auth_path = Path("hermes_cli/auth.py")
          auth_text = auth_path.read_text(encoding="utf-8")
          auth_text = replace_once(
              auth_text,
              '''    \"tencent-tokenhub\": ProviderConfig(\n        id=\"tencent-tokenhub\",\n        name=\"Tencent TokenHub\",\n        auth_type=\"api_key\",\n        inference_base_url=\"https://tokenhub.tencentmaas.com/v1\",\n        api_key_env_vars=(\"TOKENHUB_API_KEY\",),\n        base_url_env_var=\"TOKENHUB_BASE_URL\",\n    ),\n    \"ollama-cloud\": ProviderConfig(\n''',
              '''    \"tencent-tokenhub\": ProviderConfig(\n        id=\"tencent-tokenhub\",\n        name=\"Tencent TokenHub\",\n        auth_type=\"api_key\",\n        inference_base_url=\"https://tokenhub.tencentmaas.com/v1\",\n        api_key_env_vars=(\"TOKENHUB_API_KEY\",),\n        base_url_env_var=\"TOKENHUB_BASE_URL\",\n    ),\n    \"tencent-tokenplan\": ProviderConfig(\n        id=\"tencent-tokenplan\",\n        name=\"Tencent TokenPlan\",\n        auth_type=\"api_key\",\n        inference_base_url=\"https://api.lkeap.cloud.tencent.com/plan/anthropic\",\n        api_key_env_vars=(\"TOKENPLAN_API_KEY\",),\n        base_url_env_var=\"TOKENPLAN_BASE_URL\",\n    ),\n    \"ollama-cloud\": ProviderConfig(\n''',
              "register TokenPlan credential metadata",
          )
          auth_path.write_text(auth_text, encoding="utf-8")
          PY

          git diff --check
          python -m compileall -q hermes_cli/auth_store.py hermes_cli/auth.py

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install test dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Run focused regression matrix
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python -m pytest -q \
            tests/hermes_cli/test_auth_store_r3_cand_018.py \
            tests/hermes_cli/test_auth_store_r3_cand_018_adversarial.py \
            tests/hermes_cli/test_auth_store_read_failure.py \
            tests/hermes_cli/test_auth_store_windows_encoding.py \
            tests/agent/test_anthropic_credential_persist_failure.py \
            tests/hermes_cli/test_provider_catalog.py \
            tests/hermes_cli/test_provider_parity.py
          python scripts/check-windows-footguns.py --diff 372c4e2c6620a7718d1497a313598e26a3fcfa55

      - name: Run canonical Python suite
        shell: bash
        env:
          HERMES_TEST_WORKERS: "8"
        run: |
          set -euo pipefail
          source .venv/bin/activate
          scripts/run_tests.sh

      - name: Publish repaired history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Axl Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git add hermes_cli/auth_store.py hermes_cli/auth.py
          git commit -m "fix(auth): restore compatible secure store publication"
          git push --force-with-lease origin HEAD:security/auth-store-corruption
