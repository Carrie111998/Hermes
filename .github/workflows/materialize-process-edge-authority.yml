name: Export Phase-G process-edge authority object

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: phase-g-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    name: Materialize and export reviewed product tree
    if: github.head_ref == 'security/process-edge-authority-broker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout synthetic merge
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python and test environment
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Execute assertion-guarded materializer transport
        run: |
          set -euo pipefail
          source .venv/bin/activate
          set +e
          python -m pytest -q \
            tests/security/test_process_edge_authority_materializer_transport.py \
            > phase-g-transport.log 2>&1
          status=$?
          set -e
          cat phase-g-transport.log
          if [ "$status" -ne 1 ]; then
            echo "::error::transport must terminate with pytest's assertion-failure status 1; got $status"
            exit 1
          fi
          test -s phase-g-product.tar.gz
          python - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          archive = Path("phase-g-product.tar.gz")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          with tarfile.open(archive, "r:gz") as bundle:
              names = bundle.getnames()
              assert "phase-g-materialization-receipt.json" in names
              receipt = json.load(bundle.extractfile("phase-g-materialization-receipt.json"))
              assert receipt["product_file_count"] == len(names) - 1
              assert not any(name.startswith(".github/") for name in names)
              assert not any("materializer_transport" in name for name in names)
          print(f"archive_sha256={digest}")
          print(f"product_file_count={receipt['product_file_count']}")
          PY

      - name: Upload clean product archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase-g-product-${{ github.event.pull_request.head.sha }}
          path: |
            phase-g-product.tar.gz
            phase-g-transport.log
          if-no-files-found: error
          retention-days: 2
