name: Charterforge package artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: latest
          python-version: '3.13'

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist --out-dir dist

      - name: Install the built wheel in an isolated environment
        run: |
          uv venv /tmp/charterforge-artifact-venv --python 3.13
          uv pip install \
            --python /tmp/charterforge-artifact-venv/bin/python \
            dist/*.whl
          /tmp/charterforge-artifact-venv/bin/charterforge --version

      - name: Exercise the independent installer against the wheel
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          CHARTERFORGE_SOURCE="$wheel_path" \
            CHARTERFORGE_INSTALL_DIR=/tmp/charterforge-installer-venv \
            scripts/install-charterforge.sh
          /tmp/charterforge-installer-venv/bin/charterforge --version

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charterforge-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
