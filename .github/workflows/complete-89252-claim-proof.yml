class Adapter:
    platform = "discord"

    def __init__(self, token: str):
        self.token = token
        self.gateway_runner = None


class Runner:
    def __init__(self, primary: Adapter, *, secondaries=None, route=None):
        self.config = SimpleNamespace(
            multiplex_profiles=True,
            multiplex_profile_allowlist=list((secondaries or {}).keys()),
        )
        self._primary_profile_name = "default"
        self.adapters = {"discord": primary}
        self._profile_adapters = secondaries or {}
        self.route = route
        primary.gateway_runner = self
        for adapters in self._profile_adapters.values():
            for adapter in adapters.values():
                adapter.gateway_runner = self

    def _adapter_credential_claim(self, platform, adapter):
        return ("credential", platform, adapter.token)

    def _adapter_listener_claim(self, _platform, _adapter):
        return None

    def _profile_name_for_source(self, _source):
        return self.route

    def _registered_transport_adapter(self, source):
        adapter_ref = getattr(source, "_transport_adapter_ref", None)
        adapter = adapter_ref() if callable(adapter_ref) else None
        if adapter is None:
            return None
        if adapter is self.adapters.get(source.platform):
            return adapter
        for adapters in self._profile_adapters.values():
            if adapter is adapters.get(source.platform):
                return adapter
        return None


def live_source(adapter: Adapter, *, profile=None):
    return SimpleNamespace(
        platform="discord",
        profile=profile,
        profile_route_rejected=False,
        routing_identity=None,
        _transport_adapter_ref=weakref.ref(adapter),
    )


def restored_source(payload, *, profile=None):
    return SimpleNamespace(
        platform="discord",
        profile=profile,
        profile_route_rejected=False,
        routing_identity=dict(payload),
    )


def test_live_claim_persists_only_nonsecret_identity():
    adapter = Adapter("secret-token")
    runner = Runner(adapter)
    source = live_source(adapter)

    identity = resolve_identity_for_runner_source(runner, source)
    payload = persistence_payload_for_source(source)

    assert identity.transport_profile == "default"
    assert identity.transport_claim_id
    assert "secret-token" not in identity.transport_claim_id
    assert payload["transport_claim_id"] == identity.transport_claim_id
    assert getattr(source, "_transport_generation")


def test_duplicate_current_credential_claim_is_ambiguous():
    primary = Adapter("shared-token")
    secondary = Adapter("shared-token")
    runner = Runner(primary, secondaries={"reviewer": {"discord": secondary}})
    source = live_source(primary)

    verdict = resolve_transport_claim_for_runner_source(runner, source)
    assert verdict.status == "ambiguous"
    with pytest.raises(RoutingIdentityRejected, match="ambiguous"):
        resolve_identity_for_runner_source(runner, source)


def test_live_source_from_replaced_generation_cannot_rebind():
    old = Adapter("same-token")
    runner = Runner(old)
    source = live_source(old)
    resolve_identity_for_runner_source(runner, source)

    replacement = Adapter("same-token")
    replacement.gateway_runner = runner
    runner.adapters["discord"] = replacement

    verdict = resolve_transport_claim_for_runner_source(runner, source)
    assert verdict.status == "unavailable"
    with pytest.raises(RoutingIdentityRejected, match="unavailable"):
        resolve_identity_for_runner_source(runner, source)


def test_rotated_credential_rejects_persisted_transport_claim():
    old = Adapter("token-a")
    runner = Runner(old)
    source = live_source(old)
    resolve_identity_for_runner_source(runner, source)
    payload = persistence_payload_for_source(source)

    replacement = Adapter("token-b")
    runner = Runner(replacement)
    restored = restored_source(payload)

    with pytest.raises(RoutingIdentityRejected, match="unavailable"):
        resolve_identity_for_runner_source(runner, restored)


def test_unique_same_credential_recovers_after_restart():
    before = Adapter("stable-token")
    before_runner = Runner(before)
    source = live_source(before)
    original = resolve_identity_for_runner_source(before_runner, source)
    payload = persistence_payload_for_source(source)

    after = Adapter("stable-token")
    after_runner = Runner(after)
    restored = restored_source(payload)
    recovered = resolve_identity_for_runner_source(after_runner, restored)

    assert recovered == original
    assert restored._transport_adapter_ref() is after
    assert getattr(restored, "_transport_generation")


def test_restored_owner_name_cannot_self_certify_without_claim_id():
    adapter = Adapter("stable-token")
    runner = Runner(adapter)
    source = restored_source(
        {
            "transport_profile": "default",
            "runtime_profile": "default",
            "persistence_profile": "default",
        }
    )

    with pytest.raises(RoutingIdentityRejected, match="unavailable"):
        resolve_identity_for_runner_source(runner, source)


def test_shared_credential_can_serve_multiple_runtime_profiles():
    adapter = Adapter("shared-token")
    runner = Runner(adapter, secondaries={"finance": {}}, route="finance")
    source = live_source(adapter)

    identity = resolve_identity_for_runner_source(runner, source)

    assert identity.transport_profile == "default"
    assert identity.runtime_profile == "finance"
    assert identity.persistence_profile == "finance"
    assert identity.transport_claim_id


@pytest.mark.asyncio
async def test_adapter_entrypoint_rejects_duplicate_before_handler_state():
    primary = Adapter("shared-token")
    secondary = Adapter("shared-token")
    runner = Runner(primary, secondaries={"reviewer": {"discord": secondary}})
    source = live_source(primary)
    event = SimpleNamespace(source=source)
    called = False

    @routing_identity_adapter_entrypoint
    async def handler(_adapter, _event):
        nonlocal called
        called = True

    assert await handler(primary, event) is None
    assert called is False
    assert source.profile_route_rejected is True


def test_current_claim_owner_mismatch_is_conflict():
    adapter = Adapter("stable-token")
    runner = Runner(adapter)
    source = restored_source(
        {
            "transport_profile": "reviewer",
            "runtime_profile": "reviewer",
            "persistence_profile": "reviewer",
            "transport_claim_id": resolve_transport_claim_for_runner_source(
                runner, live_source(adapter)
            ).claim_id,
        },
        profile="reviewer",
    )

    with pytest.raises(RoutingIdentityConflict, match="restored owner"):
        resolve_identity_for_runner_source(runner, source)
