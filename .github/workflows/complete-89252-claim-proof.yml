        return sorted((_claim_json_value(item) for item in value), key=str)
    if value is None or isinstance(value, (bool, float, int, str)):
        return value
    return str(value)


def _adapter_claim_id(runner: Any, platform: Any, adapter: Any) -> Optional[str]:
    """Return a stable non-secret digest for the current adapter claim."""

    material = None
    for method_name in ("_adapter_credential_claim", "_adapter_listener_claim"):
        method = getattr(runner, method_name, None)
        if not callable(method):
            continue
        try:
            material = method(platform, adapter)
        except Exception:
            material = None
        if material is not None:
            break

    if material is None:
        fingerprint = getattr(runner, "_adapter_credential_fingerprint", None)
        if callable(fingerprint):
            try:
                value = fingerprint(adapter)
            except Exception:
                value = None
            if value not in (None, ""):
                material = ("credential", platform, value)

    if material is None:
        return None

    canonical = json.dumps(
        _claim_json_value(material),
        ensure_ascii=True,
        separators=(",", ":"),
        sort_keys=True,
    )
    digest = hashlib.sha256(canonical.encode("utf-8")).hexdigest()[:24]
    platform_name = getattr(platform, "value", platform)
    return f"{str(platform_name or '').strip().lower()}:{digest}"


def _adapter_generation(adapter: Any) -> str:
    generation = getattr(adapter, "_routing_identity_generation", None)
    if isinstance(generation, str) and generation:
        return generation
    generation = uuid.uuid4().hex
    try:
        adapter._routing_identity_generation = generation
    except Exception:
        # Bare immutable test doubles still have an exact object generation for
        # the current call; it is intentionally not durable.
        generation = f"object:{id(adapter)}"
    return generation


def _registered_adapter_entries(runner: Any, platform: Any) -> list[tuple[str, Any]]:
    entries: list[tuple[str, Any]] = []
    primary = (getattr(runner, "adapters", None) or {}).get(platform)
    if primary is not None:
        entries.append(
            (
                normalize_profile(
                    getattr(runner, "_primary_profile_name", None) or DEFAULT_PROFILE
                ),
                primary,
            )
        )
    for owner, adapters in (getattr(runner, "_profile_adapters", None) or {}).items():
        candidate = (adapters or {}).get(platform)
        if candidate is not None:
            entries.append((normalize_profile(owner), candidate))
    return entries


def _restored_transport_expectation(source: Any) -> tuple[Optional[str], Optional[str]]:
    attached = getattr(source, "_routing_identity", None)
    if isinstance(attached, RoutingIdentity):
        return attached.transport_profile, attached.transport_claim_id
    carried = getattr(source, "routing_identity", None)
    if isinstance(carried, Mapping):
        identity = RoutingIdentity.from_persistence_dict(carried)
        return identity.transport_profile, identity.transport_claim_id
    owner = getattr(source, "_transport_profile", None)
    claim_id = getattr(source, "_transport_claim_id", None)
    return (
        normalize_profile(owner) if owner not in (None, "") else None,
        str(claim_id or "").strip() or None,
    )


def _source_adapter_hint(
    runner: Any,
    source: Any,
    adapter: Any,
) -> tuple[Any, bool]:
    adapter_ref = getattr(source, "_transport_adapter_ref", None)
    has_live_ref = callable(adapter_ref)
    referenced = adapter_ref() if has_live_ref else None
    if has_live_ref and referenced is None:
        return None, True
    if adapter is not None and referenced is not None and adapter is not referenced:
        raise RoutingIdentityConflict(
            "adapter-local generation conflicts with source transport generation"
        )

    registered = None
    resolver = getattr(runner, "_registered_transport_adapter", None)
    if callable(resolver):
        try:
            registered = resolver(source)
        except Exception:
            registered = None
    if adapter is not None and registered is not None and adapter is not registered:
        raise RoutingIdentityConflict(
            "adapter-local generation conflicts with registered transport generation"
        )
    return adapter or referenced or registered, has_live_ref


def _bind_current_transport_source(
    source: Any,
    adapter: Any,
    *,
    claim_id: Optional[str],
    generation: str,
) -> None:
    source._transport_claim_id = claim_id
    source._transport_generation = generation
    try:
        source._transport_adapter_ref = weakref.ref(adapter)
    except TypeError:
        pass


def resolve_transport_claim_for_runner_source(
    runner: Any,
    source: Any,
    *,
    adapter: Any = None,
) -> TransportClaimVerdict:
    """Resolve the current credential owner and adapter generation.

    Live intake must point at the exact adapter object still present in the
    runner registry. Restored sources may nominate an owner only when their
    persisted non-secret claim digest resolves to one unique current adapter.
    """

    platform = getattr(source, "platform", None) or getattr(adapter, "platform", None)
    if platform is None:
        return TransportClaimVerdict(TRANSPORT_CLAIM_UNAVAILABLE)

    entries = _registered_adapter_entries(runner, platform)
    candidate, has_live_ref = _source_adapter_hint(runner, source, adapter)
    expected_owner, expected_claim_id = _restored_transport_expectation(source)

    if candidate is not None:
        owner_rows = [(owner, current) for owner, current in entries if current is candidate]
        owners = {owner for owner, _current in owner_rows}
        if not owner_rows:
            return TransportClaimVerdict(TRANSPORT_CLAIM_UNAVAILABLE)
        if len(owners) != 1:
            return TransportClaimVerdict(TRANSPORT_CLAIM_AMBIGUOUS)
        owner = next(iter(owners))
        claim_id = _adapter_claim_id(runner, platform, candidate)
        if expected_owner is not None and expected_owner != owner:
            raise RoutingIdentityConflict(
                f"current credential owner {owner!r} conflicts with expected owner "
                f"{expected_owner!r}"
            )
        if expected_claim_id is not None and expected_claim_id != claim_id:
            raise RoutingIdentityConflict(
                "current credential claim conflicts with persisted transport claim"
            )
        if claim_id is not None:
            matching = {
                (registered_owner, id(registered_adapter))
                for registered_owner, registered_adapter in entries
                if _adapter_claim_id(runner, platform, registered_adapter) == claim_id
            }
            if len(matching) != 1:
                return TransportClaimVerdict(TRANSPORT_CLAIM_AMBIGUOUS)
        generation = _adapter_generation(candidate)
        carried_generation = getattr(source, "_transport_generation", None)
        if carried_generation not in (None, "", generation):
            return TransportClaimVerdict(TRANSPORT_CLAIM_UNAVAILABLE)
        _bind_current_transport_source(
            source,
            candidate,
            claim_id=claim_id,
            generation=generation,
        )
        return TransportClaimVerdict(
            TRANSPORT_CLAIM_UNIQUE,
            owner_profile=owner,
            claim_id=claim_id,
            adapter_generation=generation,
        )

    # A source that still carries live-generation provenance must never fall
    # through to durable-name recovery after that adapter is replaced or dies.
    if has_live_ref:
        return TransportClaimVerdict(TRANSPORT_CLAIM_UNAVAILABLE)

    if expected_owner is None or expected_claim_id is None:
        return TransportClaimVerdict(TRANSPORT_CLAIM_UNAVAILABLE)

    matching = [
        (owner, current)
        for owner, current in entries
        if _adapter_claim_id(runner, platform, current) == expected_claim_id
    ]
    unique = {(owner, id(current)) for owner, current in matching}
    if not matching:
        return TransportClaimVerdict(TRANSPORT_CLAIM_UNAVAILABLE)
    if len(unique) != 1:
        return TransportClaimVerdict(TRANSPORT_CLAIM_AMBIGUOUS)

    owner, current = matching[0]
    if owner != expected_owner:
        raise RoutingIdentityConflict(
            f"current credential owner {owner!r} conflicts with restored owner "
            f"{expected_owner!r}"
        )
    generation = _adapter_generation(current)
    _bind_current_transport_source(
        source,
        current,
        claim_id=expected_claim_id,
        generation=generation,
    )
    return TransportClaimVerdict(
        TRANSPORT_CLAIM_UNIQUE,
        owner_profile=owner,
        claim_id=expected_claim_id,
        adapter_generation=generation,
    )


def _credential_owner_for_adapter(
    runner: Any,
    adapter: Any,
    source: Any,
) -> Optional[str]:
    verdict = resolve_transport_claim_for_runner_source(
        runner, source, adapter=adapter
    )
    return verdict.owner_profile if verdict.status == TRANSPORT_CLAIM_UNIQUE else None


def _credential_owner_for_source(runner: Any, source: Any) -> Optional[str]:
    verdict = resolve_transport_claim_for_runner_source(runner, source)
    return verdict.owner_profile if verdict.status == TRANSPORT_CLAIM_UNIQUE else None


