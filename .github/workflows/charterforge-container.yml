name: Charterforge container verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Compose deployment definitions
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.windows.yml config --quiet

      - name: Build independent Charterforge image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: charterforge:ci
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=charterforge-container
          cache-to: type=gha,mode=max,scope=charterforge-container

      - name: Verify image identity and CLI
        run: |
          docker image inspect charterforge:ci --format '{{.Id}}' | tee container-image-id.txt
          docker run --rm charterforge:ci --version

      - name: Upload image identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charterforge-container-${{ github.sha }}
          path: container-image-id.txt
          if-no-files-found: error
          retention-days: 14
