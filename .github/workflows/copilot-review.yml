name: Request Copilot Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: request-copilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  request-copilot:
    name: Request Copilot review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # needed to call requestReviewers
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Request Copilot review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: ['copilot-pull-request-reviewer[bot]'],
              });
              core.info('Copilot review requested');
            } catch (e) {
              const status = e.status ?? e.response?.status;
              const msg = e.response?.data?.message ?? e.message;
              if (status === 422) {
                core.warning(`Reviewer request returned 422 (benign): ${msg}`);
              } else {
                core.error(`Reviewer request failed: ${status ?? ''} ${msg}`);
                throw e;
              }
            }
