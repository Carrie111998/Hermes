name: Request CodeRabbit Review
on:
  pull_request:
    types: [opened, ready_for_review, labeled]
concurrency:
  group: request-coderabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  request-review:
    name: Request CodeRabbit and Gemini review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # needed to request reviewers via pulls.requestReviewers
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    steps:
      - name: Request CodeRabbit and Gemini reviews
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: ['coderabbitai'],
              });
              core.info('Review requested from coderabbitai');
            } catch (e) {
              const status = e.status ?? e.response?.status;
              const msg = e.response?.data?.message ?? e.message;
              if (status === 422) {
                core.warning(`Reviewer request returned 422 (benign): ${msg}`);
              } else {
                core.error(`Reviewer request failed: ${status ?? ''} ${msg}`);
                throw e;
              }
            }
