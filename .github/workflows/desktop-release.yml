name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: dist:win
            artifact: windows-x64
          - name: macOS Intel
            os: macos-13
            command: dist:mac
            artifact: macos-x64
          - name: macOS Apple Silicon
            os: macos-14
            command: dist:mac
            artifact: macos-arm64
          - name: Linux x64
            os: ubuntu-22.04
            command: dist:linux
            artifact: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        working-directory: apps/desktop
        env:
          # Fork releases are intentionally unsigned unless signing secrets are
          # configured. This prevents electron-builder from probing the runner
          # keychain for a certificate that is not available.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.rpm
            apps/desktop/release/*.zip

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Hermes ${RELEASE_TAG#v}" \
              --generate-notes
          fi
