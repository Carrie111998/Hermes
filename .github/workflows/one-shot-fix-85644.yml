    @pytest.mark.asyncio
    async def test_known_unavailable_is_not_reported_as_unknown(self):
        adapter = _adapter()
        known = await adapter._deliver_one(
            "webhook:r:d1", "hello", {"deliver": "telegram", "deliver_extra": {}}
