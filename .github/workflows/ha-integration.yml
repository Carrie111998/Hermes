name: Home Assistant Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'gateway/platforms/homeassistant.py'
      - 'tools/homeassistant_tool.py'
      - 'tests/integration/test_ha_integration.py'
      - 'tests/fakes/fake_ha_server.py'
      - '.github/workflows/ha-integration.yml'
      - 'run.sh'
      - 'profile-init.sh'
      - 'nginx-render.sh'
      - 'Dockerfile'
      - 'config.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/platforms/homeassistant.py'
      - 'tools/homeassistant_tool.py'
      - 'tests/integration/test_ha_integration.py'
      - 'tests/fakes/fake_ha_server.py'
      - '.github/workflows/ha-integration.yml'
      - 'run.sh'
      - 'profile-init.sh'
      - 'nginx-render.sh'
      - 'Dockerfile'
      - 'config.yaml'

permissions:
  contents: read

concurrency:
  group: ha-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.13
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run Home Assistant Integration Tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/integration/test_ha_integration.py -v -m integration -n0
