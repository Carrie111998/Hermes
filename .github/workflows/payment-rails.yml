name: Payment rail packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/charterforge-stripe-rail/**'
      - '.github/workflows/payment-rails.yml'
  pull_request:
    paths:
      - 'packages/charterforge-stripe-rail/**'
      - '.github/workflows/payment-rails.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stripe-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: latest
          python-version: '3.13'

      - name: Build the main charterforge wheel (dependency)
        run: |
          uv build --wheel --out-dir dist-main
          echo "MAIN_WHEEL=$(find dist-main -name '*.whl -print -quit')" >> $GITHUB_ENV

      - name: Build Stripe rail wheel
        run: |
          cd packages/charterforge-stripe-rail
          uv build --wheel --sdist --out-dir ../../dist-stripe

      - name: Install and verify Stripe rail
        run: |
          uv venv /tmp/stripe-rail-venv --python 3.13
          # Install main package first (dependency)
          uv pip install \
            --python /tmp/stripe-rail-venv/bin/python \
            dist-main/*.whl
          # Install Stripe rail
          uv pip install \
            --python /tmp/stripe-rail-venv/bin/python \
            dist-stripe/*.whl
          # Verify entry points are registered
          /tmp/stripe-rail-venv/bin/python -c "
          from hermes_cli import payments
          inbound = payments.load_inbound_payment_rails()
          outbound = payments.load_outbound_payment_rails()
          print(f'Inbound rails: {list(inbound.keys())}')
          print(f'Outbound rails: {list(outbound.keys())}')
          "

      - name: Upload Stripe rail artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charterforge-stripe-rail-${{ github.sha }}
          path: dist-stripe/
          if-no-files-found: error
          retention-days: 14
