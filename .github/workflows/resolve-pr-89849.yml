name: Resolve PR 89849 upstream conflicts

on:
  push:
    branches:
      - fix/desktop-session-owner-hint

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-session-owner-hint
          fetch-depth: 0

      - name: Merge upstream main and resolve bounded conflicts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_rc=$?
          set -e

          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          echo "merge exit: ${merge_rc}"
          echo "conflicts:"
          cat /tmp/conflicts.txt

          python <<'PY'
          from pathlib import Path

          conflicts = {line.strip() for line in Path('/tmp/conflicts.txt').read_text().splitlines() if line.strip()}
          allowed = {
              'apps/desktop/src/app/session/hooks/use-route-resume.ts',
              'apps/desktop/src/app/session/hooks/use-session-actions/index.ts',
              'apps/desktop/src/app/session/hooks/use-session-actions/resolve-stored-session.test.ts',
              'apps/desktop/src/app/session/hooks/use-session-actions/utils.ts',
              'apps/desktop/src/sdk/index.ts',
              'apps/desktop/src/sdk/profile-routing.test.ts',
              'apps/desktop/src/store/session.ts',
          }
          unexpected = conflicts - allowed
          if unexpected:
              raise SystemExit(f'Unexpected conflict(s), refusing to guess: {sorted(unexpected)}')
          PY

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            git checkout --theirs -- "$file"
          done < /tmp/conflicts.txt

          python <<'PY'
          from pathlib import Path

          conflicts = {line.strip() for line in Path('/tmp/conflicts.txt').read_text().splitlines() if line.strip()}

          def replace_once(path: str, old: str, new: str) -> None:
              if path not in conflicts:
                  return
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected merge anchor missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          route = 'apps/desktop/src/app/session/hooks/use-route-resume.ts'
          replace_once(
              route,
              '  resumeSession: (sessionId: string, focus: boolean) => Promise<unknown>\n',
              '  resumeSession: (sessionId: string, focus: boolean, ownerProfileHint?: string) => Promise<unknown>\n',
          )
          replace_once(
              route,
              "        bootResumeRef.current = false\n        void resumeSession(routedSessionId, true)\n",
              "        bootResumeRef.current = false\n        const requestedOwner = explicitlyRequested ? sessionResumeRequest?.profile : undefined\n\n        if (requestedOwner) {\n          void resumeSession(routedSessionId, true, requestedOwner)\n        } else {\n          void resumeSession(routedSessionId, true)\n        }\n",
          )

          actions = 'apps/desktop/src/app/session/hooks/use-session-actions/index.ts'
          replace_once(
              actions,
              '    async (storedSessionId: string, replaceRoute = false) => {\n',
              '    async (storedSessionId: string, replaceRoute = false, ownerProfileHint?: string) => {\n',
          )
          replace_once(
              actions,
              '      const storedForProfile = await resolveStoredSession(storedSessionId)\n',
              '      const storedForProfile = await resolveStoredSession(storedSessionId, ownerProfileHint)\n',
          )

          utils = 'apps/desktop/src/app/session/hooks/use-session-actions/utils.ts'
          replace_once(
              utils,
              "export async function resolveStoredSession(storedSessionId: string): Promise<SessionInfo | undefined> {\n  const cached = [...$sessions.get(), ...$cronSessions.get(), ...$messagingSessions.get()].find(session =>\n    sessionMatchesStoredId(session, storedSessionId)\n  )\n",
              "export async function resolveStoredSession(\n  storedSessionId: string,\n  ownerProfileHint?: string | null\n): Promise<SessionInfo | undefined> {\n  const allCached = [...$sessions.get(), ...$cronSessions.get(), ...$messagingSessions.get()]\n  const hintedProfile = (ownerProfileHint ?? '').trim()\n\n  // A profile-scoped open already knows where this session lives. Treat that\n  // ownership as authoritative instead of starting unrelated profile backends\n  // while rediscovering information the caller already supplied.\n  if (hintedProfile) {\n    const key = normalizeProfileKey(hintedProfile)\n    const hintedCached = allCached.find(\n      session => sessionMatchesStoredId(session, storedSessionId) && normalizeProfileKey(session.profile) === key\n    )\n\n    if (hintedCached) {\n      return hintedCached\n    }\n\n    try {\n      const session = await getSession(storedSessionId, key)\n      session.profile = key\n      upsertResolvedSession(session, storedSessionId)\n\n      return session\n    } catch {\n      return undefined\n    }\n  }\n\n  const cached = allCached.find(session => sessionMatchesStoredId(session, storedSessionId))\n",
          )

          tests = 'apps/desktop/src/app/session/hooks/use-session-actions/resolve-stored-session.test.ts'
          if tests in conflicts:
              p = Path(tests)
              text = p.read_text()
              anchor = "  it('scopes the first by-id lookup so a miss does not skip the active profile', async () => {\n"
              insert = """  it('uses an explicit owner hint without probing unrelated profiles', async () => {\n    $profiles.set(profiles('default', 'katana', 'agency-ai-engineer'))\n    $activeGatewayProfile.set('katana')\n    mockGetSession.mockResolvedValueOnce(session({ id: 's1', profile: 'default' }))\n\n    const resolved = await resolveStoredSession('s1', 'katana')\n\n    expect(resolved?.profile).toBe('katana')\n    expect(mockGetSession).toHaveBeenCalledTimes(1)\n    expect(mockGetSession).toHaveBeenCalledWith('s1', 'katana')\n  })\n\n  it('does not scan other profiles when an explicit owner hint misses', async () => {\n    $profiles.set(profiles('default', 'katana', 'agency-ai-engineer'))\n    $activeGatewayProfile.set('katana')\n    mockGetSession.mockRejectedValueOnce(new Error('404: Session not found'))\n\n    const resolved = await resolveStoredSession('s1', 'katana')\n\n    expect(resolved).toBeUndefined()\n    expect(mockGetSession).toHaveBeenCalledTimes(1)\n    expect(mockGetSession).toHaveBeenCalledWith('s1', 'katana')\n  })\n\n"""
              if insert not in text:
                  if anchor not in text:
                      raise SystemExit(f'Expected test insertion anchor missing in {tests}')
                  text = text.replace(anchor, insert + anchor, 1)
                  p.write_text(text)

          store = 'apps/desktop/src/store/session.ts'
          replace_once(
              store,
              "export interface SessionResumeRequest {\n  sequence: number\n  sessionId: string\n}\n",
              "export interface SessionResumeRequest {\n  sequence: number\n  sessionId: string\n  /** Authoritative owner supplied by an explicit profile-scoped open. */\n  profile?: string\n}\n",
          )
          replace_once(
              store,
              "export const requestSessionResume = (sessionId: string) => {\n  const id = sessionId.trim()\n\n  if (!id) {\n    return\n  }\n\n  $sessionResumeRequest.set({ sequence: ++sessionResumeRequestSequence, sessionId: id })\n}\n",
              "export const requestSessionResume = (sessionId: string, profile?: string) => {\n  const id = sessionId.trim()\n\n  if (!id) {\n    return\n  }\n\n  const owner = profile?.trim()\n  $sessionResumeRequest.set({\n    sequence: ++sessionResumeRequestSequence,\n    sessionId: id,\n    ...(owner ? { profile: owner } : {})\n  })\n}\n",
          )

          sdk = 'apps/desktop/src/sdk/index.ts'
          replace_once(
              sdk,
              "      if (options.awaitHydration) {\n        // Keep the target-specific overlay visible through transcript hydration,\n        // not merely through the gateway/profile activation that precedes it.\n        $gatewaySwapTarget.set(targetProfile)\n      }\n",
              "      let hydrationResumeRequested = false\n\n      if (options.awaitHydration) {\n        // Keep the target-specific overlay visible through transcript hydration,\n        // not merely through the gateway/profile activation that precedes it.\n        $gatewaySwapTarget.set(targetProfile)\n\n        // A profile-scoped open already knows the owner. Publish that request\n        // before navigation so route-resume cannot race ahead and lose it.\n        if (profile) {\n          requestSessionResume(storedSessionId, profile)\n          hydrationResumeRequested = true\n        }\n      }\n",
          )
          replace_once(
              sdk,
              "          if (options.awaitHydration && !surfaceHealthy) {\n            requestSessionResume(storedSessionId)\n          }\n",
              "          if (options.awaitHydration && !surfaceHealthy && !hydrationResumeRequested) {\n            requestSessionResume(storedSessionId, profile || undefined)\n          }\n",
          )

          routing_test = 'apps/desktop/src/sdk/profile-routing.test.ts'
          replace_once(
              routing_test,
              "    expect(requestSessionResume).toHaveBeenCalledWith('cold-bot-chat')\n",
              "    expect(requestSessionResume).toHaveBeenCalledWith('cold-bot-chat', 'hyoseob')\n",
          )
          replace_once(
              routing_test,
              "    expect(requestSessionResume).toHaveBeenCalledWith('bot-chat')\n",
              "    expect(requestSessionResume).toHaveBeenCalledWith('bot-chat', 'hyoseob')\n",
          )
          PY

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            git add "$file"
          done < /tmp/conflicts.txt

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # This workflow is a one-shot transport for the repair. Keep it out of
          # the PR's final tree and therefore out of the upstream diff.
          rm -f .github/workflows/resolve-pr-89849.yml
          git add -A

          # Guard the intended invariants before publishing the merge commit.
          grep -q "ownerProfileHint?: string" apps/desktop/src/app/session/hooks/use-session-actions/index.ts
          grep -q "ownerProfileHint?: string | null" apps/desktop/src/app/session/hooks/use-session-actions/utils.ts
          grep -q "profile?: string" apps/desktop/src/store/session.ts
          grep -q "requestSessionResume(storedSessionId, profile)" apps/desktop/src/sdk/index.ts
          git diff --cached --check

          git commit -m "chore(desktop): sync session owner fix with upstream"
          git push origin HEAD:fix/desktop-session-owner-hint
