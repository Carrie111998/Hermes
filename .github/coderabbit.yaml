language: "en-US"
tone_instructions: "Be concise and direct. Flag security issues like exposed API keys, missing .gitignore entries, and hardcoded credentials. Flag data loss risks. Skip style nitpicks."
reviews:
  profile: "assertive"
  # Auto-review stays ON here because this is a public repo, and CodeRabbit
  # reviews on public repos do not consume the paid quota.
  # Private repos in this account run on-demand only, via the `ai-review` label.
  auto_review:
    enabled: true
    drafts: true
    base_branches: ["main", "master"]
  path_filters:
    - "!**/*.lock"
    - "!**/venv/**"
    - "!**/node_modules/**"
    - "!**/frameworks/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
  finishing_touches:
    docstrings:
      enabled: false
  review_status: true
  poem: false
  collapse_walkthrough: false
  sequence_diagrams: false
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
